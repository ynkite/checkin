# main 에 올라가면 이미지를 만들어 EC2 가 받아 가게 한다.
#
# 빌드를 EC2 에서 하지 않는 이유 — 1GB 인스턴스에서 그래들 빌드를 돌리면
# 메모리가 모자라 죽는다. 여기서 만들고 서버는 받아서 띄우기만 한다.

name: deploy

# main 에 올라가면 자동으로 나간다. 버튼으로도 돌릴 수 있다.
#
# develop 이 아니라 main 인 이유 — develop 은 작업하다 말고도 올린다.
# 그때마다 서버가 교체되면 보고 있던 사람의 화면이 끊긴다. main 은
# 내보내기로 정한 것만 올리는 자리라, 올라간다는 것이 곧 배포해도
# 된다는 뜻이다. develop 에 머지하는 것만으로는 이제 안 나간다.
#
# 배포 중 20~30초는 앱이 교체되는 시간이라 접속이 끊긴다 —
# 심사 시간에는 main 에 올리지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 기본 docker 드라이버는 캐시 내보내기를 못 한다. buildx 빌더를 따로 띄운다
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/checkin:latest

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 서버에서 새 이미지로 교체
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/checkin
            docker compose pull app
            docker compose up -d
            docker image prune -f
