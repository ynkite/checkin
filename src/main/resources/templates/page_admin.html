<div th:fragment="admin" xmlns:th="http://www.thymeleaf.org">
  <script>
    /* ============================================================
     * [1구역 - 고정 UI 설정 블록]
     * ============================================================ */
    const ADMIN_MENUS = [
      { sec:'dashboard', icon:'📊', label:'대시보드', default:true },
      { sec:'users',     icon:'👤', label:'회원 관리' },
      { sec:'reports',   icon:'🚨', label:'신고 관리' },
      { sec:'curation',  icon:'✨', label:'큐레이션 관리' },
    ];
    const ADMIN_DEP_PROVINCES  = ['서울','경기','인천','강원','충남','대전','부산','제주','전체'];
    const ADMIN_DEST_PROVINCES = ['서울','경기','인천','강원','충북','충남','대전','세종','전북','전남','광주','경북','경남','대구','울산','부산','제주'];

    /* ★ STEP1/STEP2 동일 — 관리자가 선택 안 하면 빈 값으로 사용자에게 전달 */
    const ADMIN_TRANSPORT_OPTS = [
      {label:'🚗 자차',    default:false},
      {label:'🚌 대중교통', default:false},
      {label:'기타',       default:false, isOther:true},
    ];
    const ADMIN_ACC_OPTS = [
      {label:'호텔',        default:false},{label:'펜션',        default:false},
      {label:'게스트하우스', default:false},{label:'리조트',      default:false},
      {label:'기타',        default:false, isOther:true},
    ];
    const ADMIN_COMP_OPTS = [
      {label:'혼자', default:false},{label:'커플', default:false},
      {label:'가족', default:false},{label:'친구', default:false},
      {label:'기타', default:false, isOther:true},
    ];
    const ADMIN_STYLE_OPTS = [
      {label:'가성비',   default:false},{label:'럭셔리',   default:false},
      {label:'액티비티', default:false},{label:'힐링',     default:false},
      {label:'문화·역사', default:false},{label:'음식 탐방', default:false},
      {label:'기타',     default:false, isOther:true},
    ];
    const ADMIN_DIET_OPTS = [
      {label:'비건',        default:false},
      {label:'해산물 선호',  default:false},
      {label:'알러지 있음',  default:false, isOther:true},
      {label:'무관',        default:false},
      {label:'기타',        default:false, isOther:true},
    ];
    const ADMIN_SPECIAL_OPTS = [
      {label:'유아 동반',    default:false},{label:'반려동물 동반', default:false},
      {label:'노인 동반',    default:false},{label:'기타',         default:false, isOther:true},
    ];
    const ADMIN_DENSITY_OPTS = [
      {label:'빼곡하게', default:false},{label:'여유롭게', default:false},
    ];
    const ADMIN_ACCOPTS = [
      {label:'오션뷰',   default:false},{label:'취사 가능', default:false},
      {label:'조식 포함', default:false},{label:'수영장',   default:false},
      {label:'기타',     default:false, isOther:true},
    ];
    const ADMIN_PLACE_TYPES = ['🏨 숙소','📍 관광지','🍽️ 맛집','☕ 카페','🎭 문화'];

    const ADMIN_UI_TEXTS = {
      titles: {dashboard:'대시보드', users:'회원 관리', reports:'신고 관리', curation:'큐레이션 관리'},
      tables: {
        /* ★ 6열 (후기 열 없음 — 백엔드 /api/admin/users/{id}/posts 미구현) */
        usersHead:    ['ID','아이디','이름','이메일','가입일','상태','관리','전환'],
        reportsHead:  ['ID','게시글','신고자','작성자','사유','상태','처리'],
        curationHead: ['ID','제목','테마','순서','노출 기간','관리']
      },
      curationForm: {
        cardTitle:'새 큐레이션 등록',
        builderTitle:'📋 여행 플랜 구성 ',
        builderSubTitle:'(관리자 추천 여행 경로)',
        sectionTitles:[
          '🚗 이동 수단','🏨 숙소 형태','👥 동행자 유형',
          '✨ 여행 스타일 (다중 선택 가능)','🍽️ 식이 정보 (다중 선택 가능)',
          '⚙️ 특수 조건 (다중 선택 가능)','📅 일정 밀도','🏠 숙소 세부 옵션 (다중 선택 가능)'
        ],
        sectionSubs:{density:'MBTI 기반 자동 선택 (변경 가능)'},
        btnAddDay:'+ Day 추가', btnSubmit:'등록하기'
      }
    };

    /* ============================================================
     * [2구역 - 초기화 엔진]
     * ============================================================ */
    function updateCurDestCity(sel){
      const cityEl = document.getElementById('cur-dest-city');
      if(!cityEl) return;
      const cities = (typeof _cities !== 'undefined' && _cities[sel.value]) ? _cities[sel.value] : ['전체'];
      cityEl.innerHTML = cities.map(c=>`<option value="${c}">${c}</option>`).join('');
    }

    function initAdminPage() {
      // 중복 실행 방지 (go 훅 + 복원 fallback 이 동시에 호출하는 경우)
      if (window._adminPageInitialized) {
        // 이미 초기화됨: 대기 중인 섹션만 반영
        var _ps = window._pendingAdminSection;
        if (_ps) {
          window._pendingAdminSection = null;
          var _o = ['dashboard','users','reports','curation'];
          var _l = document.querySelectorAll('.admin-nav .admin-link');
          var _i = _o.indexOf(_ps);
          showAdmin(_ps, (_i !== -1 && _l[_i]) ? _l[_i] : null);
        }
        return;
      }
      window._adminPageInitialized = true;
      document.querySelector('#ad-dashboard h2').textContent = ADMIN_UI_TEXTS.titles.dashboard;
      document.querySelector('#ad-users h2').textContent     = ADMIN_UI_TEXTS.titles.users;
      document.querySelector('#ad-reports h2').textContent   = ADMIN_UI_TEXTS.titles.reports;
      document.querySelector('#ad-curation h2').textContent  = ADMIN_UI_TEXTS.titles.curation;

      // 정렬 상태
      window._uSort={col:null,dir:'asc',list:[]};
      window._rSort={col:null,dir:'asc',list:[]};

      const sortIcon=(col,state)=>{
        if(state.col!==col) return '<span style="opacity:.35;font-size:10px;margin-left:2px">↕</span>';
        return state.dir==='asc'
                ?'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↑</span>'
                :'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↓</span>';
      };

      // 회원 테이블 정렬 가능 컬럼
      const uSortKeys=['userId','username','name','email','createdAt','status',null,null];
      document.querySelector('#ad-users table thead tr').innerHTML =
              ADMIN_UI_TEXTS.tables.usersHead.map((h,i)=>{
                const key=uSortKeys[i];
                if(!key) return `<th>${h}</th>`;
                return `<th style="cursor:pointer;user-select:none" onclick="sortUserTable('${key}')">${h}${sortIcon(key,window._uSort)}</th>`;
              }).join('');

      // 신고 테이블 정렬 가능 컬럼
      const rSortKeys=['reportId',null,'reporterName',null,'reason','status',null];
      document.querySelector('#ad-reports table thead tr').innerHTML =
              ADMIN_UI_TEXTS.tables.reportsHead.map((h,i)=>{
                const key=rSortKeys[i];
                if(!key) return `<th>${h}</th>`;
                return `<th style="cursor:pointer;user-select:none" onclick="sortReportTable('${key}')">${h}${sortIcon(key,window._rSort)}</th>`;
              }).join('');

      document.querySelector('#ad-curation table thead tr').innerHTML = ADMIN_UI_TEXTS.tables.curationHead.map(h=>`<th>${h}</th>`).join('');

      document.querySelector('#ad-curation .bcard-ttl').textContent = ADMIN_UI_TEXTS.curationForm.cardTitle;
      document.querySelector('#ad-curation .plan-builder-ttl').innerHTML =
              `${ADMIN_UI_TEXTS.curationForm.builderTitle}<small style="font-size:11px;color:var(--text3);font-weight:400">${ADMIN_UI_TEXTS.curationForm.builderSubTitle}</small>`;

      const secs = ADMIN_UI_TEXTS.curationForm.sectionTitles;
      document.querySelectorAll('.cadm-sec-ttl').forEach((el,i)=>{
        if(i===6) el.innerHTML=`${secs[i]}<small style="font-size:10px;color:var(--text3);font-weight:400;margin-left:4px">${ADMIN_UI_TEXTS.curationForm.sectionSubs.density}</small>`;
        else el.textContent=secs[i]||'';
      });
      document.querySelector('#ad-curation .btn-add-day').textContent = ADMIN_UI_TEXTS.curationForm.btnAddDay;
      document.querySelector('#ad-curation .btn-next').textContent    = ADMIN_UI_TEXTS.curationForm.btnSubmit;

      /* 네비 생성 */
      const navEl=document.querySelector('.admin-nav');
      if(navEl){
        const logoEl=navEl.querySelector('.admin-logo');
        navEl.innerHTML=(logoEl?logoEl.outerHTML:'<div class="admin-logo">⚙️ Admin</div>')+
                ADMIN_MENUS.map(m=>`<button class="admin-link${m.default?' on':''}" onclick="goAdminRefresh('${m.sec}')">${m.icon} ${m.label}</button>`).join('')+
                `<div style="margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:10px"><button class="admin-link" onclick="go('main')">← 메인으로</button></div>`;
      }

      /* 셀렉트 박스 */
      const depSel=document.querySelector('select[onchange*="cadm-dep-city"]');
      const destSel=document.getElementById('cadm-dest-prov');
      if(depSel)  depSel.innerHTML =`<option value="">도/시 선택</option>`+ADMIN_DEP_PROVINCES.map(p=>`<option>${p}</option>`).join('');
      if(destSel) destSel.innerHTML=`<option value="">도/시 선택</option>`+ADMIN_DEST_PROVINCES.map(p=>`<option>${p}</option>`).join('');

      /* 칩 렌더 */
      _rChips('#cadm-chip-trans',   ADMIN_TRANSPORT_OPTS, 'c-trans',   false);
      _rChips('#cadm-chip-acc',     ADMIN_ACC_OPTS,       'c-acc',     false);
      _rChips('#cadm-chip-comp',    ADMIN_COMP_OPTS,      'c-comp',    false);
      _rChips('#cadm-chip-style',   ADMIN_STYLE_OPTS,     null,        true);
      _rChips('#cadm-chip-diet',    ADMIN_DIET_OPTS,      null,        true);
      _rChips('#cadm-chip-special', ADMIN_SPECIAL_OPTS,   null,        true);
      _rChips('#cadm-chip-density', ADMIN_DENSITY_OPTS,   'c-density', false);
      _rChips('#cadm-chip-accopts', ADMIN_ACCOPTS,        null,        true);

      /* 카드 색상 미리보기 이벤트 */
      const colorInput = document.getElementById('cur-card-color');
      const colorPreview = document.getElementById('cur-color-preview');
      if(colorInput && colorPreview){
        colorInput.addEventListener('input', function(){
          colorPreview.style.background = this.value;
        });
      }

      /* ⭐ 배지 실시간 미리보기 */
      window.updateStarPreview = function(val){
        const prev=document.getElementById('cur-star-preview'); if(!prev) return;
        const parts=(val||'').split(',').map(t=>t.trim()).filter(Boolean);
        prev.innerHTML=parts.length
                ? parts.map(t=>`<span style="padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--sage-pale);color:#1E7A69;border:1px solid var(--sage-l)">⭐ ${t}</span>`).join('')
                : '<span style="font-size:11px;color:var(--text3)">입력하면 미리보기가 표시됩니다</span>';
      };
      const starInput=document.getElementById('cur-star-badges');
      if(starInput){
        starInput.addEventListener('input',function(){ updateStarPreview(this.value); });
        updateStarPreview(starInput.value);
      }

      /* 여행지 셀렉트 초기화 */
      const destCurProvSel = document.getElementById('cur-dest-prov');
      if(destCurProvSel){
        destCurProvSel.innerHTML = '<option value="">도/시 선택</option>' +
                ADMIN_DEST_PROVINCES.map(p=>`<option value="${p}">${p}</option>`).join('');
      }

      /* ★ showAdmin 오버라이드 — 탭 전환 시 데이터 로드 */
      window.showAdmin = function(sec, btn){
        ['dashboard','users','reports','curation'].forEach(s=>{
          const e=document.getElementById('ad-'+s); if(e) e.style.display='none';
        });
        const t=document.getElementById('ad-'+sec); if(t) t.style.display='block';
        document.querySelector('.admin-nav').querySelectorAll('.admin-link').forEach(b=>b.classList.remove('on'));
        if(btn) btn.classList.add('on');
        if(sec==='users')    loadAdminUsers();
        if(sec==='reports')  loadAdminReports('PENDING');
        if(sec==='curation') loadAdminCurations();
      };

      /* ★ addDay Day1 부터 시작 */
      window._dayN = 0; _admDayCount = 0;
      window.addDay    = _admAddDay;
      window.removeDay = _admRemoveDay;
      window.addPlanItem = _admAddPlanItem;
      function _applySort(list, col, dir){
        if(!col) return list;
        return [...list].sort((a,b)=>{
          let av=a[col]??'', bv=b[col]??'';
          if(typeof av==='string') av=av.toLowerCase();
          if(typeof bv==='string') bv=bv.toLowerCase();
          if(av<bv) return dir==='asc'?-1:1;
          if(av>bv) return dir==='asc'?1:-1;
          return 0;
        });
      }

      function _reRenderUserTable(list){
        const tbody=document.getElementById('adminUserTable'); if(!tbody) return;
        // 회원 상태 배지 + 행 재렌더 (loadAdminUsers의 map 로직 재사용)
        if(!list.length){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text3)">회원이 없습니다</td></tr>';return;}
        tbody.innerHTML=list.map(u=>{
          const dateStr=u.createdAt?u.createdAt.substring(0,10).replaceAll('-','.'):'';
          let badge;
          if(u.status==='ACTIVE') badge='<span class="badge" style="background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">활성</span>';
          else if(u.status==='SUSPENDED') badge='<span class="badge" style="background:#FEF3F2;color:var(--coral);border:1px solid #FECACA;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">정지</span>';
          else if(u.status==='DELETED') badge='<span class="badge" style="background:#F5F5F5;color:#9E9E9E;border:1px solid #BDBDBD;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">탈퇴</span>';
          else badge=`<span class="badge badge-a">${u.status}</span>`;
          let suspCell='<span style="font-size:11px;color:var(--text3)">-</span>';
          let roleCell='<span style="font-size:11px;color:var(--text3)">탈퇴</span>';
          if(u.status!=='DELETED'){
            if(u.role!=='ADMIN') suspCell=u.status==='ACTIVE'?`<button class="btn-o" style="color:var(--coral);border-color:var(--coral);padding:4px 12px;font-size:12px" onclick="openSuspendModal('${u.username}','${u.userId}')">정지</button>`:`<button class="btn-o" style="color:var(--sage-d);border-color:var(--sage-d);padding:4px 12px;font-size:12px" onclick="unsuspendUser(${u.userId})">정지해제</button>`;
            else suspCell='<span style="font-size:11px;color:var(--text3)">-</span>';
            if(u.role==='USER') roleCell=u.status==='SUSPENDED'?`<button class="btn-o" style="padding:4px 12px;font-size:12px;opacity:.45;cursor:not-allowed" disabled>관리자 전환</button>`:`<button class="btn-o" style="padding:4px 12px;font-size:12px" onclick="changeRole('promote','${u.userId}','${u.username}')">관리자 전환</button>`;
            else roleCell=`<button class="btn-o" style="padding:4px 12px;font-size:12px" onclick="changeRole('demote','${u.userId}','${u.username}')">일반 회원 전환</button>`;
          }
          return`<tr data-username="${u.username}" data-email="${u.email}" data-name="${(u.name||'').replace(/"/g,'')}"><td>#${u.userId}</td><td>${u.username}</td><td style="color:var(--text2)">${u.name||'-'}</td><td>${u.email}</td><td>${dateStr}</td><td>${badge}</td><td style="white-space:nowrap">${suspCell}</td><td style="white-space:nowrap">${roleCell}</td></tr>`;
        }).join('');
        filterAdminUserRows();
      }

      window.sortUserTable=function(col){
        if(window._uSort.col===col) window._uSort.dir=window._uSort.dir==='asc'?'desc':'asc';
        else{window._uSort.col=col;window._uSort.dir='asc';}
        const sortIcon=(c)=>{if(window._uSort.col!==c) return '<span style="opacity:.35;font-size:10px;margin-left:2px">↕</span>';return window._uSort.dir==='asc'?'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↑</span>':'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↓</span>';};
        const uSortKeys=['userId','username','name','email','createdAt','status',null,null];
        document.querySelector('#ad-users table thead tr').innerHTML=ADMIN_UI_TEXTS.tables.usersHead.map((h,i)=>{const key=uSortKeys[i];if(!key)return`<th>${h}</th>`;return`<th style="cursor:pointer;user-select:none" onclick="sortUserTable('${key}')">${h}${sortIcon(key)}</th>`;}).join('');
        _reRenderUserTable(_applySort(window._uSort.list,col,window._uSort.dir));
      };

      window.sortReportTable=function(col){
        if(window._rSort.col===col) window._rSort.dir=window._rSort.dir==='asc'?'desc':'asc';
        else{window._rSort.col=col;window._rSort.dir='asc';}
        const sortIcon=(c)=>{if(window._rSort.col!==c) return '<span style="opacity:.35;font-size:10px;margin-left:2px">↕</span>';return window._rSort.dir==='asc'?'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↑</span>':'<span style="font-size:10px;margin-left:2px;color:var(--sage-d)">↓</span>';};
        const rSortKeys=['reportId',null,'reporterName',null,'reason','status',null];
        document.querySelector('#ad-reports table thead tr').innerHTML=ADMIN_UI_TEXTS.tables.reportsHead.map((h,i)=>{const key=rSortKeys[i];if(!key)return`<th>${h}</th>`;return`<th style="cursor:pointer;user-select:none" onclick="sortReportTable('${key}')">${h}${sortIcon(key)}</th>`;}).join('');
        // 정렬된 목록으로 신고 테이블 재렌더
        const sorted=_applySort(window._rSort.list,col,window._rSort.dir);
        const tbody=document.getElementById('adminReportTable'); if(!tbody) return;
        if(!sorted.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text3)">신고 내역이 없습니다</td></tr>';return;}
        const esc=s=>(s||'').toString().replace(/'/g,"\'");
        tbody.innerHTML=sorted.map(r=>{
          const actionCell=r.status==='PENDING'?`<button class="btn-o" style="padding:3px 8px;font-size:11px;color:var(--coral);border-color:var(--coral)" onclick="openReportAction('hide',${r.reportId},'${esc(r.postTitle)}','${esc(r.reporterName)}','${esc(r.reason)}')">숨김</button>&nbsp;<button class="btn-o" style="padding:3px 8px;font-size:11px" onclick="openReportAction('reject',${r.reportId},'${esc(r.postTitle)}','${esc(r.reporterName)}','${esc(r.reason)}')">반려</button>`:'<span style="font-size:11px;color:var(--text3)">-</span>';
          const pName=r.processedByName?`[${r.processedByName}]`:'';
          let rStatusBadge;
          if(r.status==='PENDING') rStatusBadge='<span class="badge" style="background:#FEF3F2;color:var(--coral);border:1px solid #FECACA;padding:3px 8px;border-radius:12px;font-size:11px">미처리</span>';
          else if(r.status==='RESOLVED') rStatusBadge=`<span class="badge" style="background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;padding:3px 8px;border-radius:12px;font-size:11px">신고${pName}</span>`;
          else if(r.status==='REJECTED') rStatusBadge=`<span class="badge" style="background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9;padding:3px 8px;border-radius:12px;font-size:11px">반려${pName}</span>`;
          else rStatusBadge=`<span class="badge">${r.status}</span>`;
          return`<tr><td>#${r.reportId}</td><td><span style="cursor:pointer;color:var(--sage-d);text-decoration:underline;font-weight:600" onclick="openAdminPostDetail(${r.postId})">${r.postTitle||('#'+r.postId)}</span></td><td>${r.reporterName||'-'}</td><td style="white-space:nowrap"><span style="font-size:12px;color:var(--text2);margin-right:6px;font-weight:500">${(r.commentId && r.commentId > 0) ? esc(r.commentAuthorName||'-') : esc(r.postAuthorName||'-')}</span><button class="btn-o" style="padding:2px 8px;font-size:11px" onclick="findReportedAuthor(${r.postId},'${esc(r.commentAuthorName||'')}')">보기</button></td><td>${r.reason}</td><td>${rStatusBadge}</td><td style="white-space:nowrap">${actionCell}</td></tr>`;
        }).join('');
      };

      window.loadAdminUsers        = loadAdminUsers;
      window.loadAdminReports      = loadAdminReports;
      window.filterAdminUserRows   = filterAdminUserRows;
      window.findReportedAuthor    = findReportedAuthor;
      window.searchAdminUserByName = searchAdminUserByName;
      window.openAdminPostDetail   = openAdminPostDetail;
      window.unsuspendUser         = unsuspendUser;
      window.loadAdminCurations    = loadAdminCurations;
      window.saveCuration          = saveCuration;
      window.openEditCuration      = openEditCuration;

    function _rChips(selector, options, pickGroup, isToggle){
      const row=document.querySelector(selector); if(!row) return;
      const otherIdMap={
        '#cadm-chip-trans':'cadm-other-trans','#cadm-chip-acc':'cadm-other-acc',
        '#cadm-chip-comp':'cadm-other-comp','#cadm-chip-style':'cadm-other-style',
        '#cadm-chip-diet':'cadm-other-diet','#cadm-chip-special':'cadm-other-special',
        '#cadm-chip-accopts':'cadm-other-accopts'
      };
      row.innerHTML=options.map(opt=>{
        const otherId=opt.isOther?(otherIdMap[selector]||null):null;
        const otherH=otherId?`;showOtherInput('${otherId}',this)`:'';
        const handler=isToggle?`tog(this)${otherH}`:`pick(this,'${pickGroup}')${otherH}`;
        return `<button class="chip chip-sm${opt.default?' on':''}" onclick="${handler}">${opt.label}</button>`;
      }).join('');
    }

                const donutsEl=document.getElementById('dash-donuts');
                if(donutsEl){

              });

      /* 기간별 통계 초기값 */
      const startEl=document.getElementById('stat-start-date');
      const endEl  =document.getElementById('stat-end-date');
      if(startEl&&endEl&&!startEl.value){
        const today=new Date(),weekAgo=new Date(today.getTime()-6*24*60*60*1000);
        startEl.value=weekAgo.toISOString().slice(0,10);

      loadAdminStatistics();

      /* 회원 목록 초기 로드 */

      loadAdminReports('PENDING');

      /* ★ 새로고침으로 특정 섹션에 진입한 경우, 해당 섹션을 활성화 */
      var _pendingSec = window._pendingAdminSection;
      window._pendingAdminSection = null;
      if (_pendingSec) {
        var _order = ['dashboard','users','reports','curation'];
        var _links = document.querySelectorAll('.admin-nav .admin-link');
        var _idx = _order.indexOf(_pendingSec);
        var _btn = (_idx !== -1 && _links[_idx]) ? _links[_idx] : null;
        showAdmin(_pendingSec, _btn);

    function renderDonut(title,segments){
      const total=segments.reduce((s,x)=>s+(x.value||0),0)||1;
      let acc=0;
      const stops=segments.map(s=>{const st=acc/total*100;acc+=(s.value||0);return`${s.color} ${st}% ${acc/total*100}%`;}).join(', ');
      const legend=segments.map(s=>`
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)">
        <span style="width:9px;height:9px;border-radius:50%;background:${s.color};display:inline-block"></span>
        <span>${s.label} ${s.value||0}</span>
      </div>`).join('');
      return`<div style="display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="font-size:12px;font-weight:700;color:var(--text3)">${title}</div>
      <div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${stops});display:flex;align-items:center;justify-content:center">
        <div style="width:58px;height:58px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800">${total}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">${legend}</div>
    </div>`;
    }

    /* ============================================================
     * [4구역 - 회원 관리] ★ 6열 / 검색 / 필터 / 승격·강등 / 정지
     * ============================================================ */
    /* ── 관리자 공통 페이지네이션 렌더러 ── */
    function renderAdminPagination(containerId, currentPage, totalPages, callbackStr) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (totalPages <= 1) { el.innerHTML = ''; return; }

      const btn = (label, page, active) =>
              `<button onclick="${callbackStr}(${page})" style="
      min-width:34px;padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;
      cursor:pointer;border:1px solid ${active ? 'var(--sage-d)' : 'var(--border2)'};
      background:${active ? 'var(--sage)' : 'var(--surface)'};
      color:${active ? '#fff' : 'var(--text2)'}
    ">${label}</button>`;

      let html = '';
      if (currentPage > 0) html += btn('‹', currentPage - 1, false);
      const start = Math.max(0, currentPage - 2);
      const end   = Math.min(totalPages - 1, start + 4);
      for (let i = start; i <= end; i++) html += btn(i + 1, i, i === currentPage);
      if (currentPage < totalPages - 1) html += btn('›', currentPage + 1, false);

      el.innerHTML = `<div style="display:flex;gap:5px;justify-content:center;margin-top:16px">${html}</div>`;
    }

    /* 페이지네이션 onclick용 래퍼 */

    function _goReportPage(page) {

      loadAdminReports(status, page);

    function loadAdminUsers(page=0, status='', searchName=''){
      const token=localStorage.getItem('accessToken');
      const headers={'Authorization':'Bearer '+token};
      const statusSel=document.getElementById('admin-user-status-filter');
      if(statusSel&&status===''&&statusSel.value) status=statusSel.value;
      if(statusSel) statusSel.value=status;

      /* 이름 검색 시 전체 로드 (클라이언트 필터) */
      const pageSize = searchName ? 9999 : 10;

      fetch(`/api/admin/users?status=${status}&page=${page}&size=${pageSize}`,{headers})
              .then(r=>r.json())
              .then(res=>{
                const tbody=document.getElementById('adminUserTable'); if(!tbody) return;
                if(!res.data||!res.data.content){
                  tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text3)">불러오기에 실패했습니다</td></tr>';
                  renderAdminPagination('admin-user-pagination', 0, 0, '_goUserPage');

                }
                const list=res.data.content||[];

                  tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text3)">회원이 없습니다</td></tr>';
                  renderAdminPagination('admin-user-pagination', 0, 0, '_goUserPage');
                  return;
                }
                /* ★ AdminUserListResponseDto: userId / username / name / email / status / role / createdAt */
                tbody.innerHTML=list.map(u=>{
                  const dateStr=u.createdAt?u.createdAt.substring(0,10).replaceAll('-','.'):'';
                  // 한글 상태 배지
                  let badge;
                  if(u.status==='ACTIVE')    badge='<span class="badge" style="background:#E8F5E9;color:#2E7D32;border:1px solid #A5D6A7;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">활성</span>';
                  else if(u.status==='SUSPENDED') badge='<span class="badge" style="background:#FEF3F2;color:var(--coral);border:1px solid #FECACA;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">정지</span>';
                  else if(u.status==='DELETED')   badge='<span class="badge" style="background:#F5F5F5;color:#9E9E9E;border:1px solid #BDBDBD;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600">탈퇴</span>';
                  else badge=`<span class="badge badge-a">${u.status}</span>`;

                  // 관리 열: 정지/정지해제만
                  let suspCell='<span style="font-size:11px;color:var(--text3)">-</span>';
                  // 전환 열: 역할 변경만
                  let roleCell='<span style="font-size:11px;color:var(--text3)">탈퇴</span>';
                  if(u.status!=='DELETED'){
                    if(u.role!=='ADMIN'){
                      suspCell=u.status==='ACTIVE'
                              ?`<button class="btn-o" style="color:var(--coral);border-color:var(--coral);padding:4px 12px;font-size:12px" onclick="openSuspendModal('${u.username}','${u.userId}')">정지</button>`
                              :`<button class="btn-o" style="color:var(--sage-d);border-color:var(--sage-d);padding:4px 12px;font-size:12px" onclick="unsuspendUser(${u.userId})">정지해제</button>`;
                    } else {
                      suspCell='<span style="font-size:11px;color:var(--text3)">-</span>';
                    }
                    if(u.role==='USER'){
                      roleCell=(u.status==='SUSPENDED')
                              ?`<button class="btn-o" style="padding:4px 12px;font-size:12px;opacity:.45;cursor:not-allowed" disabled title="정지된 회원은 관리자로 전환할 수 없습니다">관리자 전환</button>`
                              :`<button class="btn-o" style="padding:4px 12px;font-size:12px" onclick="changeRole('promote','${u.userId}','${u.username}')">관리자 전환</button>`;
                    } else {
                      roleCell=`<button class="btn-o" style="padding:4px 12px;font-size:12px" onclick="changeRole('demote','${u.userId}','${u.username}')">일반 회원 전환</button>`;
                    }
                  }
                  return`<tr data-username="${u.username}" data-email="${u.email}" data-name="${(u.name||'').replace(/"/g,'')}">
            <td>#${u.userId}</td>
            <td>${u.username}</td>
            <td style="color:var(--text2)">${u.name||'-'}</td>
            <td>${u.email}</td>
            <td>${dateStr}</td>
            <td>${badge}</td>
            <td style="white-space:nowrap">${suspCell}</td>
            <td style="white-space:nowrap">${roleCell}</td>
          </tr>`;
                }).join('');
                window._uSort.list=list;
                filterAdminUserRows();
              });
    }

    function filterAdminUserRows(){
      const kw=(document.getElementById('admin-user-search')?.value||'').trim().toLowerCase();
      document.querySelectorAll('#adminUserTable tr[data-username]').forEach(tr=>{
        if(!kw){tr.style.display='';return;}
        const hay=(tr.dataset.username+' '+tr.dataset.email+' '+(tr.dataset.name||'')).toLowerCase();
        tr.style.display=hay.includes(kw)?'':'none';
      });
    }

    /* ★ unsuspendUser — app_main.js에 없으므로 여기서 정의 */
    async function unsuspendUser(userId){
      if(!confirm('정지를 해제하시겠습니까?')) return;
      const res=await api.patch('/api/admin/users/'+userId+'/unsuspend',{});
      toast(res.success?'정지 해제 완료 · 알림 전송됨':'⚠️ 정지 해제에 실패했습니다.');
      if(res.success) loadAdminUsers();

    async function searchAdminUserByName(name){
      if(!name){toast('작성자 정보를 찾을 수 없습니다.');return;}
      const usersBtn=document.querySelector('.admin-link[onclick*="\'users\'"]');
      /* 탭 전환 */
      ['dashboard','users','reports','curation'].forEach(s=>{
        const e=document.getElementById('ad-'+s); if(e) e.style.display='none';
      });
      document.getElementById('ad-users').style.display='block';
      document.querySelectorAll('.admin-nav .admin-link').forEach(b=>b.classList.remove('on'));
      if(usersBtn) usersBtn.classList.add('on');

      /* 검색어 세팅 */
      const inp=document.getElementById('admin-user-search');
      if(inp) inp.value=name;

      /* searchName 을 넘겨서 전체 로드(size=9999) 후 클라이언트 필터 */
      await loadAdminUsers(0, '', name);
      filterAdminUserRows();
      toast(`"${name}" 검색 결과로 이동했습니다`);
    }

     * ============================================================ */

      const headers={'Authorization':'Bearer '+token};
      const statusSel=document.getElementById('admin-report-status-filter');
      if(statusSel) statusSel.value=status;

              .then(r=>r.json())
              .then(res=>{
                const tbody=document.getElementById('adminReportTable'); if(!tbody) return;
                if(!res.data||!res.data.content){
                  tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text3)">불러오기에 실패했습니다</td></tr>';
                  return;
                }
                const list=res.data.content||[];

                  tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text3)">신고 내역이 없습니다</td></tr>';

    async function findReportedAuthor(postId, commentAuthorName){
      /* 댓글 신고인 경우 commentAuthorName 이 이미 내려옴 → 바로 검색 */
      if(commentAuthorName && commentAuthorName.trim()){
        searchAdminUserByName(commentAuthorName.trim());
        return;
      }
      /* 게시글 신고인 경우 게시글 작성자를 조회 */
      const res=await api.get('/api/posts/'+postId);
      if(!res.success||!res.data){toast('작성자 정보를 불러오지 못했습니다.');return;}
      /* PostDetailResponseDto 는 writerName 필드를 사용 (authorName 아님) */
      const name = res.data.writerName || res.data.authorName
              || (res.data.author && (res.data.author.name || res.data.author.username)) || '';
      if(!name){toast('작성자 정보를 찾을 수 없습니다.');return;}
      searchAdminUserByName(name);
    }

    function loadAdminCurations(){
      const token=localStorage.getItem('accessToken');
      fetch('/api/admin/curations?page=0&size=50',{headers:{'Authorization':'Bearer '+token}})
              .then(r=>r.json())
              .then(res=>{
                const tbody=document.getElementById('curationTable'); if(!tbody) return;
                // Page<> 응답: res.data.content / 일반 배열 응답: res.data
                const list=(res.data&&res.data.content)?res.data.content:(Array.isArray(res.data)?res.data:[]);
                if(!list.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text3)">등록된 큐레이션이 없습니다</td></tr>';return;}
                tbody.innerHTML=list.map(c=>{
                  // extra_notes에서 tags, cardColor 파싱
                  let en={};
                  try{en=JSON.parse(c.extra_notes||'{}');}catch(e){}
                  const tags=(en.tags||[]).map(t=>`<span style="padding:2px 7px;border-radius:10px;font-size:10px;background:var(--sage-pale);color:var(--sage-d);border:1px solid var(--sage-l)">${t}</span>`).join(' ');
                  const colorDot=en.cardColor?`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${en.cardColor};border:1px solid var(--border2);vertical-align:middle;margin-right:4px"></span>`:'';
                  return`<tr>
            <td>#${c.curationId||c.id}</td>
            <td>${colorDot}${c.title}${tags?`<div style="margin-top:3px">${tags}</div>`:''}</td>
            <td>${c.theme||'-'}</td>
            <td>${c.displayOrder||'-'}</td>
            <td style="font-size:11px">${c.startDate?c.startDate.slice(0,10):'상시'}~${c.endDate?c.endDate.slice(0,10):'상시'}</td>
            <td>
              <button class="btn-o" style="padding:3px 8px;font-size:11px" onclick="openEditCuration(${c.curationId||c.id})">수정</button>&nbsp;
              <button class="btn-o" style="padding:3px 8px;font-size:11px;color:var(--coral);border-color:var(--coral)" onclick="deleteCuration(${c.curationId||c.id})">삭제</button>
            </td>
          </tr>`;
                }).join('');
              });
    }

    async function saveCuration(){
      const title=document.getElementById('cur-title')?.value?.trim();
      if(!title){toast('제목을 입력하세요.');return;}

      const getChipVal=(sel,multi)=>{
        const chips=[...document.querySelectorAll(`${sel} .chip.on`)].map(c=>c.textContent.trim()).filter(t=>t!=='기타');
        const otherId=sel.replace('#cadm-chip-','cadm-other-');
        const otherEl=document.getElementById(otherId);
        const otherVal=otherEl&&otherEl.classList.contains('show')&&otherEl.value?otherEl.value.trim():'';
        if(otherVal) chips.push(otherVal);
        return multi?chips:(chips[0]||'');
      };

      const days=[];
      document.querySelectorAll('#curDays .plan-day-block').forEach((block,di)=>{
        const places=[];
        block.querySelectorAll('.pdb-item').forEach(item=>{
          const name=item.querySelector('.adm-pdb-name')?.value?.trim()||''; if(!name) return;
          places.push({
            name, type:item.querySelector('.adm-pdb-type')?.value||'',
            time:item.querySelector('.adm-pdb-time')?.value||'',
            amount:parseInt(item.querySelector('.adm-pdb-amount')?.value||'0')||0,
          });
        });
        days.push({day:di+1,label:`Day ${di+1}`,places});
      });

      // 테마+태그 합친 필드 파싱 (cur-theme을 쉼표로 분리해 tags로 사용)
      const tagsRaw = document.getElementById('cur-theme')?.value?.trim() || '';
      const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];

      // Day에서 타입별 자동 추출
      const adminRecommendedAccommodations = [];
      const adminRecommendedRestaurants    = [];
      const adminRecommendedAttractions    = [];
      const adminRecommendedCafes          = [];
      const adminRecommendedCultures       = [];
      days.forEach(day => {
        (day.places||[]).forEach(p => {
          if(!p.name) return;
          const entry = p.name;
          if(p.type === '🏨 숙소')    adminRecommendedAccommodations.push(entry);
          else if(p.type === '🍽️ 맛집') adminRecommendedRestaurants.push(entry);
          else if(p.type === '📍 관광지') adminRecommendedAttractions.push(entry);
          else if(p.type === '☕ 카페')  adminRecommendedCafes.push(entry);
          else if(p.type === '🎭 문화')  adminRecommendedCultures.push(entry);
        });
      });

      // ⭐ 배지 파싱
      const starBadgesRaw = document.getElementById('cur-star-badges')?.value?.trim() || '';
      const starBadges = starBadgesRaw ? starBadgesRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];

      const extra_notes=JSON.stringify({
        cardColor: document.getElementById('cur-card-color')?.value || '#E0F7FA',
        starBadges,
        tags,
        adminRecommendedAccommodations,
        adminRecommendedRestaurants,
        adminRecommendedAttractions,
        adminRecommendedCafes,
        adminRecommendedCultures,
        preferences:{
          transport:     getChipVal('#cadm-chip-trans',   false),
          accommodation: getChipVal('#cadm-chip-acc',     false),
          companion:     getChipVal('#cadm-chip-comp',    false),
          style:         getChipVal('#cadm-chip-style',   true),
          diet:          getChipVal('#cadm-chip-diet',    true),
          special:       getChipVal('#cadm-chip-special', true),
          density:       getChipVal('#cadm-chip-density', false),
          accOptions:    getChipVal('#cadm-chip-accopts', true),
        }, days
      });

      const payload={
        title,
        theme:        document.getElementById('cur-theme')?.value?.trim()||null,
        startDate:    document.getElementById('cur-start')?.value||null,
        endDate:      document.getElementById('cur-end')?.value||null,
        displayOrder: parseInt(document.getElementById('cur-order')?.value)||1,
        destination:  (()=>{
          const prov = document.getElementById('cur-dest-prov')?.value||'';
          const city = document.getElementById('cur-dest-city')?.value||'';
          if(!prov) return null;
          return (city && city !== '전체') ? prov+'|'+city : prov;
        })(),
        extra_notes,
      };

      let res;
      if(_curEditId) res=await api.patch('/api/admin/curations/'+_curEditId,payload);
      else           res=await api.post('/api/admin/curations',payload);

      if(res&&res.success){
        toast(_curEditId?'큐레이션이 수정되었습니다.':'큐레이션이 등록되었습니다.');
        resetCurationForm(); loadAdminCurations();
      } else toast('저장에 실패했습니다.');
    }

    function resetCurationForm(){
      _curEditId=null; _admDayCount=0;
      ['cur-title','cur-theme','cur-start','cur-end','cur-tags','cur-star-badges','cur-dest-prov'].forEach(id=>{
        const el=document.getElementById(id);if(el)el.value='';
      });
      const cityResetEl=document.getElementById('cur-dest-city');
      if(cityResetEl) cityResetEl.innerHTML='<option value="">구/군 선택</option>';
      const o=document.getElementById('cur-order');if(o)o.value='1';
      const cc=document.getElementById('cur-card-color');if(cc)cc.value='#E0F7FA';
      document.getElementById('curDays').innerHTML='';
      document.querySelector('#ad-curation .bcard-ttl').textContent=ADMIN_UI_TEXTS.curationForm.cardTitle;
      document.querySelector('#ad-curation .btn-next').textContent=ADMIN_UI_TEXTS.curationForm.btnSubmit;
      document.querySelectorAll('#ad-curation .chip.on').forEach(c=>c.classList.remove('on'));
      document.querySelectorAll('#ad-curation .other-input.show').forEach(el=>{el.classList.remove('show');el.value='';});
    }

    async function openEditCuration(id){
      const res=await api.get('/api/admin/curations/'+id);
      if(!res.success||!res.data){toast('큐레이션 정보를 불러오지 못했습니다.');return;}
      const c=res.data; _curEditId=id; _admDayCount=0;
      document.getElementById('cur-title').value=c.title||'';
      document.getElementById('cur-theme').value=c.theme||'';
      document.getElementById('cur-start').value=c.startDate||'';
      document.getElementById('cur-end').value=c.endDate||'';
      document.getElementById('cur-order').value=c.displayOrder||1;
      // destination 복원 (형식: "제주" 또는 "제주|제주시")
      const destCurProvEl=document.getElementById('cur-dest-prov');
      const destCurCityEl=document.getElementById('cur-dest-city');
      if(destCurProvEl && c.destination){
        const parts = c.destination.split('|');
        destCurProvEl.value = parts[0]||'';
        updateCurDestCity(destCurProvEl);
        if(destCurCityEl && parts[1]) destCurCityEl.value = parts[1];
      }
      document.querySelector('#ad-curation .bcard-ttl').textContent='큐레이션 수정';
      document.querySelector('#ad-curation .btn-next').textContent='수정 완료';
      try{
        const en=JSON.parse(c.extra_notes||'{}');
        const pref=en.preferences||{};

        // 카드 색상 복원
        const ccEl=document.getElementById('cur-card-color');
        if(ccEl) ccEl.value=en.cardColor||'#E0F7FA';

        // 태그 복원 → cur-theme 필드에 (합친 필드)
        const themeEl=document.getElementById('cur-theme');
        if(themeEl && en.tags && en.tags.length) themeEl.value=en.tags.join(', ');

        // ⭐ 배지 복원
        const starBadgesEl=document.getElementById('cur-star-badges');
        if(starBadgesEl && en.starBadges && en.starBadges.length){
          starBadgesEl.value=en.starBadges.join(', ');
          updateStarPreview(starBadgesEl.value);
        }

        const restoreChip=(sel,val,multi)=>{
          document.querySelectorAll(`${sel} .chip`).forEach(chip=>{
            chip.classList.toggle('on',multi?val.includes(chip.textContent.trim()):val===chip.textContent.trim());
          });
        };
        restoreChip('#cadm-chip-trans',   pref.transport,     false);
        restoreChip('#cadm-chip-acc',     pref.accommodation, false);
        restoreChip('#cadm-chip-comp',    pref.companion,     false);
        restoreChip('#cadm-chip-style',   pref.style||[],     true);
        restoreChip('#cadm-chip-diet',    pref.diet||[],      true);
        restoreChip('#cadm-chip-special', pref.special||[],   true);
        restoreChip('#cadm-chip-density', pref.density,       false);
        restoreChip('#cadm-chip-accopts', pref.accOptions||[],true);
        const daysEl=document.getElementById('curDays'); daysEl.innerHTML='';
        (en.days||[]).forEach(day=>{
          _admAddDay();
          const block=daysEl.lastElementChild;
          const itemsEl=block.querySelector('.adm-day-items'); itemsEl.innerHTML='';
          (day.places||[]).forEach(p=>{
            _admAddItemToBlock(itemsEl);
            const item=itemsEl.lastElementChild;
            item.querySelector('.adm-pdb-name').value=p.name||'';
            [...item.querySelector('.adm-pdb-type').options].forEach(o=>{if(o.value===p.type)o.selected=true;});
            item.querySelector('.adm-pdb-time').value=p.time||'';
            item.querySelector('.adm-pdb-amount').value=p.amount||'';
          });
        });
      }catch(e){}
      document.querySelector('#ad-curation .bcard').scrollIntoView({behavior:'smooth'});
    }

    async function deleteCuration(id){
      if(!confirm('큐레이션을 삭제하시겠습니까?')) return;
      const res=await api.del('/api/admin/curations/'+id);
      if(res&&res.success){toast('삭제되었습니다.');loadAdminCurations();}
      else toast('삭제에 실패했습니다.');
    }

          _orig(id, addToHistory);

              </div>

            <div class="form-row">

                <label class="form-label">노출 시작</label>

                <label class="form-label">노출 순서</label>
                <input class="form-input" type="number" id="cur-order" min="1" value="1">
              </div>
              <div class="form-group">
                <label class="form-label">여행지 <small style="color:var(--text3);font-weight:400">(계획하기 시 자동 선택)</small></label>
                <div style="display:flex;gap:6px">
                  <select class="form-input" id="cur-dest-prov" style="flex:1"
                          onchange="updateCurDestCity(this)">
                    <option value="">도/시 선택</option>
                  </select>
                  <select class="form-input" id="cur-dest-city" style="flex:1">
                    <option value="">구/군 선택</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ★ 플랜 빌더 (출발지·출발일·귀환일 없음 / STEP1&2 동일 칩) -->
            <div class="plan-builder" style="background:var(--cream2);border:2px solid var(--sage-l)">
              <div class="plan-builder-ttl" style="color:var(--sage-d);font-size:14px"></div>

              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-trans"></div>
                <input class="other-input" id="cadm-other-trans" placeholder="이동 수단 직접 입력">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-acc"></div>
                <input class="other-input" id="cadm-other-acc" placeholder="숙소 형태를 직접 입력해주세요">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-comp"></div>
                <input class="other-input" id="cadm-other-comp" placeholder="동행자 유형을 직접 입력해주세요">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-style"></div>
                <input class="other-input" id="cadm-other-style" placeholder="스타일 직접 입력">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-diet"></div>
                <input class="other-input" id="cadm-other-diet" placeholder="식이 정보를 직접 입력해주세요">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-special"></div>
                <input class="other-input" id="cadm-other-special" placeholder="특수 조건을 직접 입력해주세요">
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px"></div>
                <div class="chip-row" id="cadm-chip-density"></div>
              </div>
              <div style="background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border2)">
                <div class="cadm-sec-ttl" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px"></div>
                <div class="chip-row" id="cadm-chip-accopts"></div>
                <input class="other-input" id="cadm-other-accopts" placeholder="숙소 세부 옵션을 직접 입력해주세요">

              <div id="curDays"></div>
              <button class="btn-add-day" onclick="addDay()" style="margin-top:8px;border-color:var(--sage-l);color:var(--sage-d)"></button>

            <div style="display:flex;gap:10px;margin-top:12px">
              <button class="btn-next" id="cur-save-btn" style="flex:1" onclick="saveCuration()"></button>
              <button class="btn-o" style="padding:10px 18px;font-size:13px" onclick="resetCurationForm()">초기화</button>

    <!-- ══════════ 정지 모달 (Image3 디자인) ══════════ -->
    <div class="overlay" id="suspendModal" onclick="if(event.target===this)closeSuspendModal()">
      <div class="sus-wrap">
        <div class="sus-hd">
          <div class="sus-ttl"><span style="color:var(--coral);font-size:20px">⊘</span> 회원 정지 처리</div>
          <button onclick="closeSuspendModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1">✕</button>
        </div>
        <div class="sus-info">
          <div class="sus-row"><span class="sus-lbl">회원 ID</span><span class="sus-val" id="su-id"></span></div>
          <div class="sus-row"><span class="sus-lbl">아이디</span><span class="sus-val" id="su-username"></span></div>
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label class="form-label" style="font-weight:700;margin-bottom:6px;display:block">정지 사유 <span style="color:var(--coral)">*</span></label>
          <select class="form-input" id="su-reason-select" style="background:var(--cream2)">
            <option value="">사유 선택...</option>
            <option value="스팸/광고성 콘텐츠">스팸/광고성 콘텐츠</option>
            <option value="비정상 활동 감지">비정상 활동 감지</option>
            <option value="욕설 및 혐오 표현">욕설 및 혐오 표현</option>
            <option value="허위 정보 유포">허위 정보 유포</option>
            <option value="개인정보 침해">개인정보 침해</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <!-- ★ 정지 사유 상세 (보이는 textarea) -->
        <div class="form-group" style="margin-bottom:14px">
        <textarea class="form-input" id="su-detail" rows="3"
                  placeholder="정지 사유를 상세히 입력해주세요..."
                  style="resize:vertical;background:var(--cream2);font-family:inherit"></textarea>
        </div>
        <div class="sus-notif">
          <div class="sus-n-ttl">🔔 정지 알림 메시지</div>
          <div class="sus-n-sub">로그인 시 해당 회원에게 표시될 메시지입니다</div>
          <textarea class="sus-n-ta" id="su-notify-msg" rows="2"
                    placeholder="귀하의 계정은 운영 정책 위반으로 인해 정지되었습니다.(커뮤니티, 댓글 기능 이용불가능)"></textarea>
        </div>
        <div class="sus-guide">
          ℹ 정지 처리 시 해당 계정은 로그아웃 처리되며, 로그인 시 정지 알림이 표시됩니다.<br>
          정지 계정은 로그아웃 및 마이페이지 내 정보 관리만 가능합니다.
        </div>
        <div class="sus-foot">
          <button class="btn-sus-ok" onclick="confirmSuspend()">정지 완료</button>
          <button class="btn-sus-cl" onclick="closeSuspendModal()">취소</button>
        </div>
      </div>
    </div>

    <!-- ══════════ 신고 처리 모달 ══════════ -->
    <div class="overlay" id="reportActionModal" onclick="if(event.target===this)closeReportAction()">
      <div class="modal" style="width:440px">
        <div class="modal-hd">
          <div class="modal-ttl" id="reportActionTitle">신고 처리</div>
          <button class="modal-x" onclick="closeReportAction()">✕</button>
        </div>
        <div class="modal-bd">
          <p style="font-size:12px;color:var(--text3);margin-bottom:10px">
            신고 ID #<span id="ra-id"></span> · 게시글 "<span id="ra-post"></span>" · 신고자 <span id="ra-reporter"></span>
          </p>
          <p style="font-size:12px;color:var(--text2);margin-bottom:14px">신고 사유: <span id="ra-reason"></span></p>
          <div class="form-group">
            <label class="form-label" id="ra-reason-label">처리 사유 <span style="color:var(--coral)">*</span></label>
            <select class="form-input" id="ra-reason-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label">상세 메모 (선택)</label>
            <textarea class="form-input" id="ra-detail" rows="2" style="resize:vertical"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">사용자에게 보낼 알림 메시지</label>
            <textarea class="form-input" id="ra-notify-msg" rows="2" style="resize:vertical"></textarea>
          </div>
          <button class="btn-f" id="ra-confirm-btn" style="width:100%;margin-top:6px" onclick="confirmReportAction()">처리 완료</button>
        </div>
      </div>
    </div>
