<div th:fragment="phone" xmlns:th="http://www.thymeleaf.org">
  <!-- 휴대폰 이어 보기 — 마이페이지 「내 여행 기록」에서 연다. 그림은 phone-qr.js -->
  <div class="overlay" id="phoneQr" onclick="if(event.target===this)closePhoneQr()">
    <div class="modal pq" role="dialog" aria-modal="true" aria-labelledby="pqTitle">
      <button type="button" class="modal-x" onclick="closePhoneQr()" aria-label="닫기"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
      <p class="mp-mttl" id="pqTitle">휴대폰으로 이어 보기</p>
      <p class="pq-sub">휴대폰 카메라로 QR 코드를 비춰 주세요. 같은 계정으로 로그인하면 이 여행을 이어서 볼 수 있어요.</p>
      <label class="pq-pick"><span>여행</span><select id="pqTrip" onchange="drawPhoneQr()"></select></label>
      <div class="pq-code" id="pqCode" role="img" aria-label="이 여행 주소를 담은 QR 코드"></div>
      <p class="pq-url" id="pqUrl"></p>
    </div>
  </div>
</div>
