<div th:fragment="place" xmlns:th="http://www.thymeleaf.org">
    <!-- ===================================================
     * 파일명: page_place.html
     * 도메인: 장소(Place) / 후기(Review)
     * 클래스: PlaceController → PlaceServiceImpl → PlaceRepository
     * Entity: Place, PlaceReview, PlaceTag
     * DTO:    PlaceSearchDto, PlaceResponseDto, ReviewWriteDto, ReviewResponseDto
     * 기능:   후기 상세(page-review), 후기 수정(page-edit-review),
     *          장소 리뷰 목록(page-place-reviews), 모달(prevModal/confirmModal/shareModal)
     * API:
     *   GET    /api/posts/{postId}                    후기 상세
     *   GET    /api/posts/{postId}/comments           댓글 목록
     *   POST   /api/posts/{postId}/comments           댓글 작성
     *   POST   /api/posts/{postId}/likes              좋아요
     *   POST   /api/posts/{postId}/scraps             스크랩
     *   POST   /api/posts/{postId}/reports            신고
     *   PATCH  /api/posts/{postId}                    후기 수정
     *   GET    /api/maps/places?keyword=...           장소 리뷰 목록
     *   POST   /api/trips/{tripId}/share              공유 링크 생성
     *   GET    /api/trips/{tripId}/members            공유 멤버 조회
     *   POST   /api/trips/{tripId}/members            멤버 초대
     =================================================== -->


    <!-- =====================================================
         후기 상세  (page-review)
         진입: go('review') + window._currentPostId = postId
         ===================================================== -->
    <div class="page" id="page-review">
        <div class="review-wrap">
            <div class="review-back" onclick="go('community')">← 커뮤니티로 돌아가기</div>

            <div style="margin-bottom:10px">
                <span class="post-cat cat-route" id="pr-cat"></span>&nbsp;
                <span class="post-cat" style="background:var(--sage-pale);color:var(--sage-d)" id="pr-tag"></span>
            </div>

            <h1 class="review-h1" id="pr-title"></h1>

            <div class="review-meta-row">
                <div class="au-av" id="pr-author-av"></div>
                <strong id="pr-author-name"></strong>
                <div id="pr-meta" style="display:inline-flex;gap:8px"></div>
                <button class="btn-o" style="padding:4px 10px;font-size:11px"
                        onclick="doReviewLike()">❤️ 좋아요</button>
                <button class="btn-o" style="padding:4px 10px;font-size:11px"
                        onclick="doReviewScrap()">★ 스크랩</button>
                <button class="btn-o" style="padding:4px 10px;font-size:11px;color:var(--coral);border-color:var(--coral)"
                        onclick="doReviewReport()">🚨 신고</button>
                <button class="btn-o" style="padding:4px 10px;font-size:11px;margin-left:auto;display:none"
                        id="btn-review-edit" onclick="goEditReview()">✏️ 수정</button>
            </div>

            <div class="review-plan-badge" id="pr-plan-badge"></div>
            <div class="review-body" id="pr-body">
                <div style="text-align:center;padding:40px;color:var(--text3)">불러오는 중...</div>
            </div>
            <div class="bcard" style="margin-top:18px;margin-bottom:18px;display:none" id="pr-place-list"></div>
            <div class="comment-box" id="pr-comments"></div>

            <div class="review-cta">
                <div class="rcta-ttl">✈️ 이 경로가 마음에 드셨나요?</div>
                <div class="rcta-sub" id="pr-cta-sub"></div>
                <button class="btn-rcta" onclick="go('planner')">이 경로로 여행 계획하기 →</button>
            </div>
        </div>
    </div>


    <!-- =====================================================
         후기 수정  (page-edit-review)
         진입: go('edit-review') + window._currentPostId = postId
         ===================================================== -->
    <div class="page" id="page-edit-review">
        <div class="review-wrap">
            <div class="review-back" onclick="go('review')">← 후기로 돌아가기</div>
            <h2 style="font-size:22px;font-weight:800;margin-bottom:18px">✏️ 후기 수정</h2>
            <div class="bcard write-form">

                <div class="form-group">
                    <label class="form-label">제목</label>
                    <input class="form-input" id="editReviewTitle" placeholder="후기 제목을 입력하세요">
                </div>

                <div class="form-group">
                    <label class="form-label">내용
                        <small style="color:var(--text3);font-weight:400">(이미지 Ctrl+V · 드래그&드롭 지원)</small>
                    </label>
                    <div style="border:1.5px solid var(--border2);border-radius:var(--r-sm);overflow:hidden">
                        <div style="display:flex;gap:4px;padding:7px 10px;background:var(--cream);border-bottom:1px solid var(--border2)">
                            <button style="padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:700"
                                    onclick="document.getElementById('editBlogEditor').focus();document.execCommand('bold')">B</button>
                            <button style="padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:12px;font-style:italic"
                                    onclick="document.getElementById('editBlogEditor').focus();document.execCommand('italic')">I</button>
                            <button style="padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:12px;text-decoration:underline"
                                    onclick="document.getElementById('editBlogEditor').focus();document.execCommand('underline')">U</button>
                            <button style="padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:12px"
                                    onclick="document.getElementById('editImgInput').click()">🖼️ 이미지</button>
                            <input type="file" id="editImgInput" accept="image/*" style="display:none"
                                   onchange="insertEditImage(this)">
                        </div>
                        <div id="editBlogEditor" contenteditable="true"
                             data-placeholder="여행 후기를 수정하세요..."
                             style="min-height:200px;padding:14px;font-size:14px;color:var(--text);line-height:1.8;outline:none;font-family:inherit"></div>
                    </div>
                </div>

                <div class="form-group" id="edit-places-container"></div>

                <div class="form-group">
                    <label class="form-label">공개 여부</label>
                    <div style="display:flex;gap:8px;margin-top:4px">
                        <button class="vis-chip on" onclick="pickVis(this)">🌐 공개</button>
                        <button class="vis-chip" onclick="pickVis(this)">🔒 비공개</button>
                    </div>
                </div>

                <div style="display:flex;gap:8px;margin-top:14px">
                    <button class="btn-next" onclick="doEditReviewSave()">수정 저장</button>
                    <button class="btn-prev-step" onclick="go('review')">취소</button>
                </div>
            </div>
        </div>
    </div>


    <!-- =====================================================
         장소 리뷰 목록  (page-place-reviews)
         진입: go('place-reviews') + window._currentPlaceKeyword = '장소명'
         ===================================================== -->
    <div class="page" id="page-place-reviews">
        <div class="place-review-wrap">
            <div class="review-back" onclick="go('community')">← 커뮤니티로 돌아가기</div>
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"
                 id="place-reviews-header"></div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px"
                 id="place-stats-grid"></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px"
                 id="place-tags-box"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                <div style="font-size:14px;font-weight:700">리뷰 목록</div>
                <select class="form-input" style="width:auto;padding:6px 10px;font-size:12px;cursor:pointer"
                        onchange="loadPlaceReviewsSorted(this.value)">
                    <option value="latest">최신순</option>
                    <option value="rating_desc">별점 높은순</option>
                    <option value="rating_asc">별점 낮은순</option>
                </select>
            </div>
            <div style="display:flex;flex-direction:column;gap:12px" id="place-review-list">
                <div style="text-align:center;padding:40px;color:var(--text3)">불러오는 중...</div>
            </div>
        </div>
    </div>


    <!-- =====================================================
         플랜 미리보기 모달  (prevModal)
         ===================================================== -->
    <div class="overlay" id="prevModal" onclick="if(event.target===this)closePrev()">
        <div class="modal" style="width:580px">
            <button class="modal-x" onclick="closePrev()">✕</button>
            <div class="modal-hd">
                <div style="flex:1">
                    <div class="prev-tags" id="prevTags"></div>
                    <div class="prev-plan-ttl" id="prevPlanTtl"></div>
                </div>
            </div>
            <div class="modal-bd">
                <div class="prev-stats-row">
                    <div class="prev-stat-card">
                        <div class="psc-val" id="prevBudget"></div>
                        <div class="psc-label">예산 합산 검증액</div>
                    </div>
                    <div class="prev-stat-card">
                        <div class="psc-val" id="prevPlaces"></div>
                        <div class="psc-label">방문 장소</div>
                    </div>
                    <div class="prev-stat-card">
                        <div class="psc-val" id="prevDur"></div>
                        <div class="psc-label">일정</div>
                    </div>
                </div>
                <div class="prev-map-box">
                    <div id="prevKakaoMap" style="width:100%;height:100%"></div>
                </div>
                <div class="prev-section-ttl">🏨 숙소 스냅샷</div>
                <div class="prev-stay-list" id="prevStay"></div>
                <div class="prev-section-ttl">🍽️ 맛집 리스트 핵심글</div>
                <div id="prevFoodList"></div>
                <div class="prev-acts">
                    <button class="btn-prev-plan" onclick="closePrev();go('planner')">
                        → 해당 경로로 여행 계획하기
                    </button>
                    <button class="btn-prev-scrap" onclick="doPreviewScrap()">🔖 스크랩</button>
                </div>
            </div>
        </div>
    </div>


    <!-- =====================================================
         플랜 확정 모달  (confirmModal)
         ===================================================== -->
    <div class="overlay" id="confirmModal"
         onclick="if(event.target===this)this.classList.remove('open')">
        <div class="modal" style="width:400px">
            <div class="modal-hd">
                <div class="modal-ttl">✅ 플랜 확정</div>
                <button class="modal-x"
                        onclick="this.closest('.overlay').classList.remove('open')">✕</button>
            </div>
            <div class="modal-bd">
                <p style="font-size:13px;color:var(--text2);margin-bottom:14px">
                    확정 시 플랜이 DB에 저장됩니다. 공개 여부를 설정해주세요.
                </p>
                <div class="form-group">
                    <label class="form-label">공개 여부</label>
                    <div style="display:flex;gap:8px;margin-top:4px">
                        <button class="vis-chip on" onclick="pickVis(this)">🌐 공개</button>
                        <button class="vis-chip" onclick="pickVis(this)">🔒 비공개</button>
                    </div>
                </div>
                <button class="btn-next" style="width:100%;margin-top:14px"
                        onclick="doConfirmPlan()">확정 저장 후 지도로 이동</button>
            </div>
        </div>
    </div>


    <!-- =====================================================
         여행 플랜 공유 모달  (shareModal)
         ===================================================== -->
    <div class="overlay" id="shareModal"
         onclick="if(event.target===this)this.classList.remove('open')">
        <div class="modal" style="width:440px; padding:24px 28px;">
            <div class="modal-hd" style="border-bottom:none; padding-bottom:0; margin-bottom:16px;">
                <h2 style="font-size:18px; font-weight:800; display:flex; align-items:center; gap:6px;">
                    🔗 여행 플랜 공유
                </h2>
                <button class="modal-x" onclick="this.closest('.overlay').classList.remove('open')">✕</button>
            </div>

            <div style="display:flex; gap:16px; border-bottom:1px solid var(--border2); margin-bottom:20px;">
                <button class="share-tab on" onclick="setShareTab(this, 'members')" style="padding:0 4px 10px; font-size:14px; font-weight:700; color:var(--sage-d); border-bottom:3px solid var(--sage); cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;">공유</button>
                <button class="share-tab" onclick="setShareTab(this, 'post')" style="padding:0 4px 10px; font-size:14px; font-weight:700; color:var(--text3); cursor:pointer; background:none; border:none;">게시</button>
            </div>

            <div id="share-members">
                <div style="display:flex; gap:8px; margin-bottom:24px;">
                    <input type="email" id="share-email-inp" placeholder="이메일로 그룹 멤버 초대 (편집 권한)" style="flex:1; background:var(--cream); border:none; border-radius:6px; padding:12px 14px; font-size:13px; outline:none;">
                    <button onclick="inviteShareMember()" style="background:var(--sage); color:#fff; border:none; border-radius:6px; padding:0 20px; font-weight:700; font-size:13px; cursor:pointer;">초대</button>
                </div>

                <div id="share-member-list" style="display:flex; flex-direction:column; gap:16px; margin-bottom:30px; min-height:60px;">
                </div>

                <div style="font-size:11px; font-weight:700; color:var(--text3); margin-bottom:8px;">읽기 전용 링크 복사</div>
                <div style="display:flex; gap:8px; background:var(--cream); padding:6px; border-radius:8px;">
                    <input type="text" id="share-link-url" readonly style="flex:1; background:none; border:none; padding:4px 8px; font-size:13px; color:var(--text2); outline:none;">
                    <button onclick="doShareLinkCopy()" style="background:var(--sage); color:#fff; border:none; border-radius:6px; padding:10px 16px; font-weight:700; font-size:13px; cursor:pointer;">링크 복사</button>
                </div>
            </div>

                <div id="share-post" style="display:none">
                    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">
                        이 여행 플랜을 커뮤니티에 후기로 게시합니다.
                    </p>
                    <button class="btn-next" style="width:100%"
                            onclick="this.closest('.overlay').classList.remove('open');
                         document.getElementById('commWriteModal')
                           &&document.getElementById('commWriteModal').classList.add('open')">
                        커뮤니티 후기 작성하기
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- =====================================================
         JS — API 연동 로직
         ===================================================== -->
    <script>
        /* ============================================================
         * page_place.html — API 연동 스크립트
         *
         * 공통 유틸(apiCall, api.get/post/patch, Token, toast)은
         * app_main.js에 정의되어 있습니다.
         * ============================================================ */

        /* ────────────────────────────────────────────────
         * 1. 후기 상세   GET /api/posts/{postId}
         *    window._currentPostId 를 세팅한 뒤 go('review') 호출
         * ──────────────────────────────────────────────── */
        async function loadReviewDetail(postId) {
            window._currentPostId = postId;

            const res = await apiCall(`/api/posts/${postId}`);
            if (!res.success) { toast('후기를 불러올 수 없습니다.'); return; }
            const d = res.data;

            // 카테고리 / 태그
            _setText('pr-cat', d.category || '');
            _setText('pr-tag', d.tag || '');

            // 제목
            _setText('pr-title', d.title || '');

            // 작성자
            const avEl = document.getElementById('pr-author-av');
            if (avEl) avEl.textContent = (d.authorName || '?')[0];
            _setText('pr-author-name', d.authorName || '');
            _setHTML('pr-meta',
                `<span>${d.createdAt||''}</span>
     <span>👁 ${d.viewCount||0}</span>
     <span>❤️ ${d.likeCount||0}</span>`);

            // 수정 버튼 — 내 글일 때만
            const editBtn = document.getElementById('btn-review-edit');
            if (editBtn) editBtn.style.display = d.isMine ? '' : 'none';

            // 연결 플랜 배지
            if (d.connectedTrip) {
                _setHTML('pr-plan-badge', `
      <div style="font-size:12px;font-weight:700;color:var(--sage-d)">📋 연결된 플랜</div>
      <div style="font-size:13px;color:var(--text2);flex:1">${d.connectedTrip.summary||''}</div>
      <button class="btn-f" style="padding:6px 12px;font-size:11px"
              onclick="openPreview('${d.connectedTrip.tripId}')">미리보기</button>`);
            }

            // 방문 장소별 별점
            if (d.placeReviews && d.placeReviews.length) {
                _setHTML('pr-place-list',
                    `<div class="bcard-ttl">📍 방문 장소별 별점 & 한줄평</div>` +
                    d.placeReviews.map(p => `
        <div class="place-review-card" style="cursor:pointer"
             onclick="showReviewDetail(
               '${esc(p.placeName)}','${esc(p.placeType)}',
               '${esc(p.stars)} ${p.rating||''}','${esc(p.comment)}')">
          <div class="prc-icon" style="background:${p.iconBg||'var(--sage-pale)'}">
            ${p.icon||'📍'}
          </div>
          <div style="flex:1">
            <div class="prc-name">${p.placeName||''}</div>
            <div class="prc-type">${p.placeType||''}</div>
          </div>
          <div style="display:flex;align-items:center">
            <span class="prc-stars">${p.stars||''}</span>
            <span class="prc-rating">${p.rating||''}</span>
          </div>
          <div class="prc-comment">"${p.comment||''}"</div>
        </div>`).join(''));
            }

            // 본문
            _setHTML('pr-body', d.content || '');

            // CTA
            _setText('pr-cta-sub',
                `${d.destination||''} 여행을 내 일정으로 만들어보세요.`);

            // 댓글
            await loadComments(postId);
        }

        /* ────────────────────────────────────────────────
         * 2. 댓글 목록   GET /api/posts/{postId}/comments
         * ──────────────────────────────────────────────── */
        async function loadComments(postId) {
            const area = document.getElementById('pr-comments');
            if (!area) return;

            const res = await apiCall(`/api/posts/${postId}/comments`);
            const list = (res.success && Array.isArray(res.data)) ? res.data : [];

            area.innerHTML = `
    <div class="comment-ttl">
      💬 댓글 <span style="color:var(--sage)">${list.length}</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div class="comm-av" style="flex-shrink:0">나</div>
      <div style="flex:1">
        <input class="search-inp" type="text" id="commentInput"
               placeholder="댓글을 입력하세요..."
               onkeydown="if(event.key==='Enter')doCommentWrite()"
               style="margin-bottom:6px;width:100%">
        <button class="btn-f" style="padding:6px 13px;font-size:11px"
                onclick="doCommentWrite()">등록</button>
      </div>
    </div>` +
                list.map(c => `
      <div style="display:flex;gap:8px;margin-bottom:11px">
        <div class="comm-av">${(c.authorName||'?')[0]}</div>
        <div class="comm-bubble">
          <div class="comm-hd">
            <span class="comm-author">${c.authorName||''}</span>
            <span class="comm-date">${c.createdAt||''}</span>
          </div>
          <div class="comm-text">${c.content||''}</div>
        </div>
      </div>`).join('');
        }

        /* ────────────────────────────────────────────────
         * 3. 댓글 작성   POST /api/posts/{postId}/comments
         * ──────────────────────────────────────────────── */
        async function doCommentWrite() {
            const postId = window._currentPostId;
            const input  = document.getElementById('commentInput');
            if (!input?.value.trim()) { toast('댓글을 입력해주세요.'); return; }
            if (!Token.getAccess())   { toast('로그인이 필요합니다.'); go('login'); return; }

            const res = await api.post(`/api/posts/${postId}/comments`,
                { content: input.value.trim() });
            if (res.success) {
                input.value = '';
                toast('댓글이 등록되었습니다.');
                await loadComments(postId);
            } else {
                toast(res.message || '댓글 등록에 실패했습니다.');
            }
        }

        /* ────────────────────────────────────────────────
         * 4. 좋아요   POST /api/posts/{postId}/likes
         * ──────────────────────────────────────────────── */
        async function doReviewLike() {
            const postId = window._currentPostId;
            if (!Token.getAccess()) { toast('로그인이 필요합니다.'); go('login'); return; }
            const res = await api.post(`/api/posts/${postId}/likes`, {});
            toast(res.success ? '❤️ 좋아요!' : (res.message || '좋아요 처리 실패'));
        }

        /* ────────────────────────────────────────────────
         * 5. 스크랩   POST /api/posts/{postId}/scraps
         * ──────────────────────────────────────────────── */
        async function doReviewScrap() {
            const postId = window._currentPostId;
            if (!Token.getAccess()) { toast('로그인이 필요합니다.'); go('login'); return; }
            const res = await api.post(`/api/posts/${postId}/scraps`, {});
            toast(res.success ? '★ 스크랩 완료!' : (res.message || '스크랩 처리 실패'));
        }

        /* ────────────────────────────────────────────────
         * 6. 신고   POST /api/posts/{postId}/reports
         * ──────────────────────────────────────────────── */
        async function doReviewReport() {
            if (!confirm('이 게시글을 신고하시겠습니까?')) return;
            const postId = window._currentPostId;
            if (!Token.getAccess()) { toast('로그인이 필요합니다.'); go('login'); return; }
            const res = await api.post(`/api/posts/${postId}/reports`,
                { reason: '부적절한 게시글' });
            toast(res.success ? '신고가 접수되었습니다.' : (res.message || '신고 처리 실패'));
        }

        /* ────────────────────────────────────────────────
         * 7. 후기 수정 페이지 진입
         * ──────────────────────────────────────────────── */
        async function goEditReview() {
            go('edit-review');

            const post = window._currentPostDetail;
            if (!post) { toast('후기 정보를 찾을 수 없습니다.'); return; }

            // 제목
            const titleEl = document.getElementById('editReviewTitle');
            if (titleEl) titleEl.value = post.title || '';

            // 본문 (raw content)
            const bodyEl = document.getElementById('editBlogEditor');
            if (bodyEl) bodyEl.innerHTML = post.content || '';

            // 공개/비공개 버튼 상태
            document.querySelectorAll('#page-edit-review .vis-chip').forEach(btn => {
                const wantPublic = !btn.textContent.includes('비공개');
                btn.classList.toggle('on', wantPublic === post.isPublic);
            });

            // 장소 리뷰 로드
            const postId    = window._currentPostId;
            const container = document.getElementById('edit-places-container');
            if (!container || !postId) return;

            container.innerHTML = '';

            try {
                const res     = await api.get(`/api/posts/${postId}/place-reviews`);
                const reviews = (res && Array.isArray(res.data)) ? res.data
                              : Array.isArray(res) ? res : [];

                if (!reviews.length) return;

                container.innerHTML = `
                    <label class="form-label" style="display:block;margin-bottom:10px">
                        📍 방문 장소별 별점 &amp; 한줄평
                    </label>
                    <div id="edit-place-list">
                        ${reviews.map(r => `
                        <div class="edit-plr-row" data-review-id="${r.id}">
                            <div class="edit-plr-name">
                                <span class="edit-plr-cat">${r.category || ''}</span>
                                ${esc(r.placeName || '')}
                            </div>
                            <div class="star-sel" data-rating="${r.rating || 0}">
                                ${[1,2,3,4,5].map(n =>
                                    `<button class="star-btn${n <= (r.rating||0) ? ' lit' : ''}"
                                             onclick="setStars(this,${n})">★</button>`
                                ).join('')}
                            </div>
                            <input class="one-line edit-plr-comment"
                                   value="${esc(r.comment || '')}"
                                   placeholder="한줄평 (선택)" maxlength="200">
                        </div>`).join('')}
                    </div>`;
            } catch (e) {
                console.error('[edit] 장소 리뷰 로드 실패', e);
            }
        }

        /* ────────────────────────────────────────────────
         * 8. 후기 수정 저장   PATCH /api/posts/{postId}
         * ──────────────────────────────────────────────── */
        async function doEditReviewSave() {
            const postId  = window._currentPostId;
            const title   = document.getElementById('editReviewTitle')?.value.trim();
            const content = document.getElementById('editBlogEditor')?.innerHTML.trim();
            const activeChip = document.querySelector('#page-edit-review .vis-chip.on');
            const isPublic   = activeChip ? !activeChip.textContent.includes('비공개') : true;

            if (!title)   { toast('제목을 입력해주세요.'); return; }
            if (!content) { toast('내용을 입력해주세요.'); return; }

            // 1. 게시글 수정
            const res = await api.patch(`/api/posts/${postId}`, { title, content, isPublic });
            if (!res || res.success === false) {
                toast(res?.message || '수정에 실패했습니다.');
                return;
            }

            // 2. 장소 리뷰 수정
            const rows = document.querySelectorAll('#edit-place-list .edit-plr-row');
            if (rows.length) {
                const reviews = Array.from(rows)
                    .map(row => ({
                        placeReviewId: Number(row.dataset.reviewId),
                        rating: Number(row.querySelector('.star-sel')?.dataset.rating || 0),
                        comment: (row.querySelector('.edit-plr-comment')?.value || '').trim() || null
                    }))
                    .filter(r => r.placeReviewId && r.rating >= 1);

                if (reviews.length) {
                    await api.patch(`/api/posts/${postId}/place-reviews`, { reviews });
                }
            }

            toast('✅ 수정이 완료되었습니다.');
            go('review');
            loadReviewDetail(postId);
        }

        /* ────────────────────────────────────────────────
         * 9. 에디터 이미지 삽입
         * ──────────────────────────────────────────────── */
        function insertEditImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.cssText = 'max-width:100%;border-radius:8px;margin:8px 0';
                const editor = document.getElementById('editBlogEditor');
                const sel = window.getSelection();
                if (sel.rangeCount && editor.contains(sel.anchorNode)) {
                    const r = sel.getRangeAt(0); r.deleteContents(); r.insertNode(img);
                } else { editor.appendChild(img); }
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        /* ────────────────────────────────────────────────
         * 10. 장소 리뷰 목록   GET /api/maps/places?keyword=...
         *     window._currentPlaceKeyword 세팅 후 go('place-reviews') 호출
         * ──────────────────────────────────────────────── */
        async function loadPlaceReviews(keyword) {
            window._currentPlaceKeyword = keyword;

            const headerEl = document.getElementById('place-reviews-header');
            if (headerEl) headerEl.innerHTML = `
    <div class="prc-icon" style="background:var(--sage-pale);font-size:22px">📍</div>
    <div>
      <div style="font-size:18px;font-weight:800">${keyword}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:2px">불러오는 중...</div>
    </div>`;

            const res = await api.get(`/api/maps/places?keyword=${encodeURIComponent(keyword)}`);
            if (!res.success || !res.data) {
                _setHTML('place-review-list',
                    `<div style="text-align:center;padding:40px;color:var(--text3)">
         리뷰를 불러올 수 없습니다.</div>`);
                return;
            }

            const place = Array.isArray(res.data) ? res.data[0] : res.data;

            window._currentPlaceId       = place.id || place.placeId || null;
            window._currentPlaceCategory = place.category || place.type || 'tour';

            // 헤더
            if (headerEl) headerEl.innerHTML = `
    <div class="prc-icon" style="background:var(--sage-pale);font-size:22px">
      ${place.icon||'📍'}
    </div>
    <div style="flex:1">
      <div style="font-size:18px;font-weight:800">${place.name||keyword}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:2px">
        ${place.region||''} · ${place.type||''} &nbsp;·&nbsp;
        📌 ${place.planCount||0}번 플랜에 담김 &nbsp;·&nbsp;
        <span style="color:var(--warm);font-weight:700">
          ★ 스크랩 ${place.scrapCount||0}
        </span>
      </div>
    </div>
    <button class="btn-o" style="padding:6px 14px;font-size:12px"
            onclick="doPlaceScrap()">★ 스크랩</button>`;

            // 통계
            _setHTML('place-stats-grid', `
    <div class="prev-stat-card">
      <div class="psc-val">${place.avgRating||'—'}</div>
      <div class="psc-label">★★★★★ 평균 평점</div>
    </div>
    <div class="prev-stat-card">
      <div class="psc-val">${place.reviewCount||0}</div>
      <div class="psc-label">총 리뷰 수</div>
    </div>
    <div class="prev-stat-card">
      <div class="psc-val">${place.scrapCount||0}</div>
      <div class="psc-label">스크랩 수</div>
    </div>`);

            // 태그
            if (place.tags && place.tags.length) {
                _setHTML('place-tags-box', place.tags.map(t =>
                    `<span style="padding:4px 12px;background:var(--sage-pale);color:var(--sage-d);
                    border-radius:20px;font-size:12px;font-weight:600">${t}</span>`
                ).join(''));
            }

            renderPlaceReviewList(place.reviews || []);
        }

        async function loadPlaceReviewsSorted(sort) {
            const kw = window._currentPlaceKeyword;
            if (!kw) return;
            const res = await api.get(
                `/api/maps/places?keyword=${encodeURIComponent(kw)}&sort=${sort}`);
            const place = res.success && (Array.isArray(res.data) ? res.data[0] : res.data);
            if (place) renderPlaceReviewList(place.reviews || []);
        }

        function renderPlaceReviewList(reviews) {
            const listEl = document.getElementById('place-review-list');
            if (!listEl) return;
            if (!reviews.length) {
                listEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3)">
      아직 등록된 리뷰가 없습니다.</div>`;
                return;
            }
            listEl.innerHTML = reviews.map(r => `
    <div style="background:var(--surface);border:1px solid var(--border2);
                border-radius:var(--r);padding:16px">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div class="comm-av">${(r.authorName||'?')[0]}</div>
        <div>
          <div style="font-weight:700;font-size:13px">${r.authorName||''}</div>
          <div style="font-size:11px;color:var(--text3)">${r.createdAt||''}</div>
        </div>
        <div style="margin-left:auto;color:var(--warm);font-weight:700">
          ${r.stars||''} ${r.rating||''}
        </div>
      </div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6">
        ${r.content||''}
      </div>
    </div>`).join('');
        }

        /* ────────────────────────────────────────────────
         * 11. 장소 스크랩 (커뮤니티 스크랩 패턴 활용)
         * ──────────────────────────────────────────────── */
        async function doPlaceScrap() {
            if (!window._commUtil?.requireLogin()) {
                toast('로그인이 필요합니다.'); go('login'); return;
            }
            const placeId = window._currentPlaceId;
            if (!placeId) { toast('장소 정보를 찾을 수 없습니다.'); return; }
            const category = window._currentPlaceCategory || 'tour';
            const res = await api.post(`/api/places/${placeId}/scraps`, { category });
            toast(res?.success !== false ? '★ 스크랩했습니다!' : (res?.message || '이미 스크랩한 장소입니다.'));
        }

        /* ────────────────────────────────────────────────
         * 12. 미리보기 모달 스크랩
         * ──────────────────────────────────────────────── */
        async function doPreviewScrap() {
            const postId = window._currentPostId;
            if (postId) {
                const res = await api.post(`/api/posts/${postId}/scraps`, {});
                toast(res.success ? '🔖 스크랩 완료!' : (res.message || '스크랩 처리 실패'));
            } else {
                toast('🔖 스크랩 완료!');
            }
            closePrev();
        }

        /* ────────────────────────────────────────────────
         * 13. 플랜 확정   PATCH /api/trips/{tripId}
         * ──────────────────────────────────────────────── */
        async function doConfirmPlan() {
            const tripId   = window._currentTripId;
            const isPublic = !!document.querySelector('#confirmModal .vis-chip.on')
                ?.textContent.includes('공개');
            if (tripId) {
                await api.patch(`/api/trips/${tripId}`, { isPublic });
            }
            document.getElementById('confirmModal').classList.remove('open');
            go('map');
            toast('✅ 플랜이 확정되었습니다!');
            document.getElementById('confirmDoneModal').classList.add('open');
        }

        /* ────────────────────────────────────────────────
         * 14. 공유 모달 — 링크 생성 + 멤버 목록
         *     POST /api/trips/{tripId}/share
         *     GET  /api/trips/{tripId}/members
         * ──────────────────────────────────────────────── */
        async function loadShareModal() {
            const tripId = window._currentTripId || sessionStorage.getItem('plannerDraftId');
            if (!tripId) {
                document.getElementById('share-member-list').innerHTML = '<div style="font-size:13px;color:var(--text3);">저장된 플랜이 없습니다.</div>';
                return;
            }

            // 💡 읽기 전용 링크 세팅 (/plan/view 경로)
            const linkEl = document.getElementById('share-link-url');
            if (linkEl) linkEl.value = `${window.location.origin}/plan/view?id=${tripId}`;

            // 멤버 목록 렌더링
            const membersRes = await api.get(`/api/trips/${tripId}/members`);
            const listEl = document.getElementById('share-member-list');

            if (listEl) {
                if (membersRes.success && Array.isArray(membersRes.data) && membersRes.data.length > 0) {
                    listEl.innerHTML = membersRes.data.map(m => `
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                          <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:36px; height:36px; border-radius:50%; background:${m.role === 'OWNER' ? 'var(--sage)' : '#E5E7EB'}; color:${m.role === 'OWNER' ? '#fff' : '#333'}; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;">${(m.name||'?')[0]}</div>
                            <div style="font-weight:700; font-size:14px; color:#111;">${m.name||''} ${m.role === 'OWNER' ? '<span style="color:#2563EB; font-weight:800;">(소유자)</span>' : ''}</div>
                          </div>
                          <div style="font-size:12px; color:var(--text3);">${m.role==='OWNER'?'소유자':'편집자'}</div>
                        </div>`).join('');
                } else {
                    // 연동 전 가짜 데이터
                    const me = (typeof _currentUser !== 'undefined' && _currentUser) ? _currentUser.name : '나';
                    listEl.innerHTML = `
                      <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div style="display:flex; align-items:center; gap:12px;">
                          <div style="width:36px; height:36px; border-radius:50%; background:var(--sage); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;">${me[0]}</div>
                          <div style="font-weight:700; font-size:14px; color:#111;">${me} <span style="color:#2563EB; font-weight:800;">(소유자)</span></div>
                        </div>
                        <div style="font-size:12px; color:var(--text3);">소유자</div>
                      </div>`;
                }
            }
        }

        /* ────────────────────────────────────────────────
         * 15. 멤버 초대   POST /api/trips/{tripId}/members
         * ──────────────────────────────────────────────── */
        async function doShareInvite() {
            const tripId = window._currentTripId || sessionStorage.getItem('plannerDraftId');
            const input  = document.getElementById('shareEmailInput');
            if (!input?.value.trim()) { toast('이메일을 입력해주세요.'); return; }
            if (!tripId) { toast('공유할 플랜이 없습니다.'); return; }

            const emails = input.value.split(',').map(e => e.trim()).filter(Boolean);
            let successCount = 0;
            for (const email of emails) {
                // 편집자(EDITOR) 권한 부여
                const res = await api.post(`/api/trips/${tripId}/members`, { email, role: 'EDITOR' });
                if(res.success) successCount++;
            }
            if(successCount > 0) {
                toast('✅ 초대(편집 권한)가 발송되었습니다.');
                input.value = '';
                await loadShareModal();
            } else {
                toast('⚠️ 초대 실패. 가입된 유저인지 확인해주세요.');
            }
        }

        /* ────────────────────────────────────────────────
         * 16. 공유 링크 복사 (읽기 전용)
         * ──────────────────────────────────────────────── */
        function doShareLinkCopy() {
            const linkEl = document.getElementById('share-link-url');
            if (!linkEl || !linkEl.value) {
                toast('링크가 없습니다.'); return;
            }
            navigator.clipboard?.writeText(linkEl.value)
                .then(() => toast('✅ 읽기 전용 링크가 복사되었습니다!'))
                .catch(() => toast('링크 복사에 실패했습니다.'));
        }

        /* ────────────────────────────────────────────────
         * 17. openShareModal — 열릴 때 데이터 자동 로드
         * ──────────────────────────────────────────────── */
        function openShareModal() {
            document.getElementById('shareModal').classList.add('open');
            // 열릴 때 기본적으로 '공유' 탭 표시
            setShareTab(document.querySelector('.share-tab'), 'members');
            loadShareModal();
        }

        /* ────────────────────────────────────────────────
         * 18. 공유 팝업 탭 전환 로직
         * ──────────────────────────────────────────────── */
        function setShareTab(btn, tab) {
            if(!btn) return;
            document.querySelectorAll('#shareModal .share-tab').forEach(b => {
                b.classList.remove('on');
                b.style.color = 'var(--text3)';
                b.style.borderBottom = 'none';
            });
            btn.classList.add('on');
            btn.style.color = 'var(--sage-d)';
            btn.style.borderBottom = '3px solid var(--sage)';

            document.getElementById('share-members').style.display = tab === 'members' ? 'block' : 'none';
            document.getElementById('share-post').style.display    = tab === 'post' ? 'block' : 'none';
        }

        /* ────────────────────────────────────────────────
         * 내부 헬퍼
         * ──────────────────────────────────────────────── */
        function _setText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }
        function _setHTML(id, html) {
            const el = document.getElementById(id);
            if (el) el.innerHTML = html;
        }
        function esc(str) {
            return (str || '').replace(/'/g, "\\'");
        }
    </script>
