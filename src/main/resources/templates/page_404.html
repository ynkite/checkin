<div th:fragment="not_found" xmlns:th="http://www.thymeleaf.org">
  <div class="page" id="page-404" aria-labelledby="notFoundTitle">
    <section style="margin:0 auto;padding:calc(var(--u) * 10) var(--pad-page);text-align:center;word-break:keep-all;">
      <h1 id="notFoundTitle" style="margin:0;color:var(--ink);font-size:var(--t-h2);">페이지를 찾을 수 없습니다</h1>
      <p style="margin:calc(var(--u) * 2) 0 0;color:var(--ink-2);">주소를 다시 확인하거나 첫 화면으로 돌아가 주세요.</p>
      <button class="btn-nav-primary" type="button" onclick="goHomeRefresh()" style="margin-top:calc(var(--u) * 3);">첫 화면으로</button>
    </section>
  </div>
</div>
