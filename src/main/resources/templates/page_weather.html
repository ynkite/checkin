<div th:fragment="weather" xmlns:th="http://www.thymeleaf.org">
    <!-- ===================================================
     * 파일명: page_weather.html
     * 도메인: 날씨(Weather)
     * 기능:   7일 예보 + 날짜 하나 조회
     * API:
     *   GET /api/maps/weather/range?region=&from=&to=   날짜 범위 (DayWeather)
     *   GET /api/maps/weather/day?region=&date=         날짜 하나
     *
     * 앞 사흘은 기상청 단기예보(getVilageFcst), 뒤 나흘은 중기예보
     * (getMidLandFcst + getMidTa)다. 열흘을 넘기면 예보가 없다 —
     * 그때는 없다고 말하고 바깥 예보로 보낸다. source 필드가 알려 준다.
     =================================================== -->

    <div class="page" id="page-weather">
        <div class="info-wrap wx-wrap">

            <header class="wx-hd">
                <span class="wx-eye">날씨</span>
                <h2 class="wx-h1">가는 날 날씨를 미리 확인하세요</h2>
                <p class="wx-sub">오늘부터 7일 치 기상청 예보입니다.
                    사흘 뒤까지는 단기예보라 비교적 잘 맞고, 그다음 나흘은 중기예보라 빗나갈 때가 더 많습니다.</p>
            </header>

            <div class="wx-pick">
                <label for="wxRegion">지역</label>
                <select id="wxRegion" aria-label="지역">
                    <option>서울</option>
                    <option>부산</option>
                    <option>인천</option>
                    <option>대전</option>
                    <option>대구</option>
                    <option>광주</option>
                    <option>수원</option>
                    <option>전주</option>
                    <option>강릉</option>
                    <option>제주</option>
                </select>
            </div>

            <section class="fl wx-week">
                <div class="wx-week-hd">
                    <h3 id="wxWeekTitle">예보를 불러오는 중</h3>
                    <span class="wx-legend">
                        <i></i>단기예보<i class="m"></i>중기예보
                    </span>
                </div>
                <div class="wx-days" id="wxDays"></div>
                <p class="wx-note" id="wxNote" hidden></p>
            </section>

            <section class="fl wx-one">
                <h3>날짜로 보기</h3>
                <p class="wx-one-sub">여행 날짜를 고르면 그날 기온과 비 올 확률을 보여 드립니다.</p>
                <input type="date" id="wxDate" aria-label="날짜">
                <div class="wx-one-body" id="wxOne">
                    <p class="wx-one-sub">아직 고른 날짜가 없습니다.</p>
                </div>
            </section>

        </div>
    </div>

    <script>
        (function initWeatherTab() {
            var DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];
            var DAYS = 7;

            /* 날씨 그림 — 이모지 대신 선 아이콘.
               이모지는 기기마다 다르게 그려지고 색을 맞출 수 없다.
               색은 CSS(.wx)가 정한다. */
            function wxIcon(kind) {
                var o = '<svg class="wx" viewBox="0 0 24 24" aria-hidden="true">';
                var sun = '<circle cx="12" cy="9.5" r="4"/><path d="M12 1.6v2M12 15.4v2M4.4 9.5h2M17.6 9.5h2M6.6 4.1l1.4 1.4M16 13.5l1.4 1.4M17.4 4.1L16 5.5M8 13.5l-1.4 1.4"/>';
                var sunS = '<circle cx="8.5" cy="7" r="3.1"/><path d="M8.5 1.4v1.6M3.4 7H1.8M4.6 3.1l1.1 1.1M4.6 10.9l1.1-1.1"/>';
                var cloud = '<path d="M7.4 19h9.2a3.6 3.6 0 0 0 .3-7.2 5.1 5.1 0 0 0-9.8-1A3.6 3.6 0 0 0 7.4 19Z"/>';
                var rain = '<path d="M9 21.4l-.9 1.8M13 21.4l-.9 1.8M17 21.4l-.9 1.8"/>';
                if (kind === 'clear') o += sun;
                else if (kind === 'partly') o += sunS + cloud;
                else if (kind === 'cloud') o += cloud;
                else if (kind === 'rain') o += cloud + rain;
                else o += cloud;
                return o + '</svg>';
            }

            /* DayWeather.sky 는 글자다 — 맑음 / 구름많음 / 흐림 / 평년 */
            function kindOf(d) {
                if (d.rainExpected || (d.rainProb != null && d.rainProb >= 60)) return 'rain';
                if (!d.sky) return 'partly';
                if (d.sky.indexOf('맑음') >= 0) return 'clear';
                if (d.sky.indexOf('흐림') >= 0) return 'cloud';
                return 'partly';
            }

            function ymd(s) {                      /* "20260919" -> Date */
                return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
            }

            function iso(d) {
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function md(d) {
                return String(d.getMonth() + 1).padStart(2, '0') + '/' +
                    String(d.getDate()).padStart(2, '0');
            }

            function srcName(s) {
                if (s === 'SHORT') return '단기예보';
                if (s === 'MID') return '중기예보';
                return '예보 없음';
            }

            /* ── 7일 ─────────────────────────────────────── */
            function drawWeek(region, list) {
                var title = document.getElementById('wxWeekTitle');
                var box = document.getElementById('wxDays');
                var note = document.getElementById('wxNote');
                if (!box) return;

                if (!list.length) {
                    title.textContent = region + ' 예보';
                    box.innerHTML = '<p class="wx-o-none"><b>예보를 불러오지 못했습니다.</b>' +
                        '잠시 뒤에 다시 열어 보세요.</p>';
                    note.hidden = true;
                    return;
                }

                var first = ymd(list[0].date);
                var last = ymd(list[list.length - 1].date);
                title.textContent = region + ' · ' + md(first) + ' ~ ' + md(last);
                /* 칸 수를 여기서 직접 박으면 인라인이라 좁은 화면 규칙을 전부 이긴다.
                   320px 에서 일곱 칸이 그대로 남아 한 칸이 35px 이 됐고,
                   「09/22 화」가 두 줄로 쪼개지면서 아래 줄까지 층이 어긋났다.
                   몇 날인지만 넘기고, 좁을 때 몇 칸으로 접을지는 CSS 가 정한다. */
                box.style.setProperty('--wx-cols', Math.min(7, list.length));

                var wet = [];
                var midSeen = false;
                box.innerHTML = list.map(function (d, i) {
                    var dt = ymd(d.date);
                    var lab = i === 0 ? '오늘' : i === 1 ? '내일'
                        : md(dt) + ' ' + DAYS_KO[dt.getDay()];
                    var isRain = d.rainExpected || (d.rainProb != null && d.rainProb >= 60);
                    if (isRain) wet.push(md(dt));
                    var firstMid = (d.source === 'MID' && !midSeen);
                    if (d.source === 'MID') midSeen = true;
                    return '<div class="wx-d' + (i === 0 ? ' on' : '') +
                        (isRain ? ' wx-wet' : '') + (firstMid ? ' wx-mid-first' : '') + '">' +
                        '<div class="wx-d-lab">' + lab + '</div>' +
                        '<div class="wx-d-ic">' + wxIcon(kindOf(d)) + '</div>' +
                        '<div class="wx-d-t">' + (d.tempMax != null ? d.tempMax + '°' : '—') +
                        (d.tempMin != null ? ' <s>' + d.tempMin + '°</s>' : '') + '</div>' +
                        '<div class="wx-d-sky">' + (d.sky || '') + '</div>' +
                        '<div class="wx-d-pop">' +
                        (d.rainProb != null ? '강수 ' + d.rainProb + '%' : '') + '</div>' +
                        '</div>';
                }).join('');

                if (wet.length) {
                    note.hidden = false;
                    note.innerHTML = '<b>' + wet.join(' · ') + '</b>에 비 소식이 있습니다. ' +
                        '그날은 실내 일정을 먼저 살펴보세요.';
                } else {
                    note.hidden = true;
                }
            }

            /* ── 날짜 하나 ────────────────────────────────── */
            function drawOne(region, d, asked) {
                var box = document.getElementById('wxOne');
                if (!box) return;

                var dt = d ? ymd(d.date) : asked;
                var head = (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 ' +
                    '(' + DAYS_KO[dt.getDay()] + ')';

                /* 열흘을 넘긴 날짜는 예보가 없다. 평년값을 예보처럼 보여 주면
                   그 날 그 온도인 줄 안다. 없다고 말하고 바깥으로 보낸다. */
                if (!d || d.source === 'NORMAL') {
                    var q = encodeURIComponent(region + ' 날씨');
                    box.innerHTML =
                        '<div class="wx-o-hd"><span class="wx-o-day">' + head + '</span>' +
                        '<span class="wx-o-src">예보 없음</span></div>' +
                        '<div class="wx-o-none"><b>아직 예보가 나오지 않았습니다.</b>' +
                        '기상청 예보는 열흘 뒤까지만 나옵니다. 그 뒤 날짜는 여행이 가까워지면 채워집니다.' +
                        (d && d.tempMin != null
                            ? '<div class="wx-o-normal">이 달 평년 기온은 <b>' + d.tempMin +
                              '°~' + d.tempMax + '°</b>쯤입니다. 예보가 아니라 2011~2020년 월평균을 어림한 값입니다.</div>'
                            : '') +
                        '</div>' +
                        '<div class="wx-links">' +
                        '<a href="https://www.weather.go.kr/w/weather/forecast/mid-term.do" ' +
                        'target="_blank" rel="noopener">기상청 중기예보</a>' +
                        '<a href="https://weather.naver.com/?q=' + q + '" ' +
                        'target="_blank" rel="noopener">네이버 날씨</a>' +
                        '</div>';
                    return;
                }

                box.innerHTML =
                    '<div class="wx-o-hd"><span class="wx-o-day">' + head + '</span>' +
                    '<span class="wx-o-src">' + srcName(d.source) + '</span></div>' +
                    '<div class="wx-o-row">' +
                    '<div class="wx-o-big">' + (d.tempMax != null ? d.tempMax + '°' : '—') +
                    (d.tempMin != null ? ' <s>' + d.tempMin + '°</s>' : '') + '</div>' +
                    '<div class="wx-o-f">하늘<b>' + (d.sky || '—') + '</b></div>' +
                    '<div class="wx-o-f">강수 확률<b>' +
                    (d.rainProb != null ? d.rainProb + '%' : '—') + '</b></div>' +
                    '</div>' +
                    (d.rainExpected
                        ? '<p class="wx-note"><b>비 소식이 있습니다.</b> ' +
                          '비가 오면 실내 일정을 먼저 봐 주세요.</p>'
                        : '');
            }

            /* ── 불러오기 ─────────────────────────────────── */
            async function get(url) {
                var res = await fetch(url);
                var json = await res.json();
                if (!json.success) throw new Error(json.message || '실패');
                return json.data;
            }

            var region = '서울';

            async function loadWeek() {
                var today = new Date();
                var to = new Date(today);
                to.setDate(today.getDate() + DAYS - 1);
                try {
                    var list = await get('/api/maps/weather/range?region=' +
                        encodeURIComponent(region) + '&from=' + iso(today) + '&to=' + iso(to));
                    drawWeek(region, list || []);
                } catch (e) {
                    drawWeek(region, []);
                    console.warn('[날씨] 7일 예보 실패:', e);
                }
            }

            async function loadOne(dateStr) {
                var asked = new Date(dateStr + 'T00:00:00');
                try {
                    var d = await get('/api/maps/weather/day?region=' +
                        encodeURIComponent(region) + '&date=' + dateStr);
                    drawOne(region, d, asked);
                } catch (e) {
                    drawOne(region, null, asked);
                    console.warn('[날씨] 날짜 조회 실패:', e);
                }
            }

            function wire() {
                var sel = document.getElementById('wxRegion');
                var day = document.getElementById('wxDate');
                if (sel && !sel.dataset.wired) {
                    sel.dataset.wired = '1';
                    sel.addEventListener('change', function () {
                        region = this.value;
                        loadWeek();
                        if (day && day.value) loadOne(day.value);
                    });
                }
                if (day && !day.dataset.wired) {
                    day.dataset.wired = '1';
                    day.min = iso(new Date());
                    day.addEventListener('change', function () {
                        if (this.value) loadOne(this.value);
                    });
                }
            }

            /* go('weather') 가 부른다. 플래너는 지역을 넘겨 준다 —
               window.renderWeatherTab('부산') */
            window.renderWeatherTab = function (r) {
                if (r) {
                    region = r;
                    var sel = document.getElementById('wxRegion');
                    if (sel) sel.value = r;
                }
                wire();
                loadWeek();
                var day = document.getElementById('wxDate');
                if (day && day.value) loadOne(day.value);
            };
        })();
    </script>

</div>
