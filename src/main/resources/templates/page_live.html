<div th:fragment="live" xmlns:th="http://www.thymeleaf.org">
  <!-- ===================================================
   * 파일명: page_live.html
   * 도메인: 실시간
   * 하는 일: 저장된 여행을 골라 「지금 어떤가」를 크게 보여 준다.
   *
   * 지도 화면과 뭐가 다른가 —
   *   지도    전체 일정을 펼쳐 놓고 손으로 옮긴다. 앉아서 쓰는 화면
   *   실시간  지금 한 구간만 크게. 움직이면서 보는 화면
   *
   * 여행 전날에도 들어올 수 있다. 그때는 「내일 이 시각이면」으로 답한다.
   *
   * API
   *   GET /api/live/trips                    열 수 있는 여행 목록
   *   GET /api/live/now?tripId=&lat=&lng=    지금 상황 한 벌
   *   POST /api/route/travel-time            자차 이동시간 (대중교통·도보는 제공하지 않는다)
   *   GET /api/tour/visitor-trend            지역 방문자 (시도 단위 과거 실측)
   =================================================== -->
  <div class="page" id="page-live">
    <div class="rl-wrap">

      <!-- 여행 고르기 -->
      <section class="rl-pick" id="rlPick">
        <div class="rl-hd">
          <p class="rl-eye">실시간</p>
          <h1 class="rl-ttl">지금 볼 여행을 골라 주세요</h1>
          <p class="rl-sub">고르면 지금 어디쯤인지, 다음이 어디인지 바로 나옵니다.
            여행 전날에도 미리 볼 수 있습니다.</p>
        </div>
        <div class="rl-trips" id="rlTrips">
          <p class="rl-load">불러오는 중</p>
        </div>
      </section>

      <!-- 지금 상황 -->
      <section class="rl-now" id="rlNow" hidden>
        <button type="button" class="rl-back" onclick="rlBack()">여행 바꾸기</button>

        <p class="rl-when" id="rlWhen"></p>
        <!-- 언제 받은 값인가. 실시간이라고 말하는 화면은 이걸 말해야 한다 -->
        <p class="rl-fresh" id="rlFresh" role="status" aria-live="polite" hidden></p>
        <h2 class="rl-head" id="rlHead"></h2>

        <div class="rl-next" id="rlNext"></div>

        <!-- 갈래 넷 — 장소 확인하기 · 순서 바꾸기 · 다른 곳으로 · 길 안내.
             이 화면에서 제일 중요한 자리인데 단추가 흩어져 있어 그렇게 안 보였다.
             한 묶음으로 세우고 무엇을 할 수 있는지 제목으로 말해 준다 -->
        <div class="rl-branch" role="group" aria-labelledby="rlBranchLb">
          <p class="rl-branch-lb" id="rlBranchLb">지금 할 수 있는 것</p>
          <div class="rl-acts rl-acts-single">
            <button type="button" class="rl-act" id="rlCheckBtn" onclick="rlCheck()">
              <b>장소 확인하기</b><span>다음 장소가 붐비는지, 비가 오는지, 늦지 않는지 봅니다</span>
            </button>
          </div>
          <div id="rlCheck" class="rl-check" hidden role="status" aria-live="polite"></div>

          <div class="rl-acts" id="rlActs"></div>
        </div>

        <!-- 「다른 곳으로」가 고른 후보. 고르는 것은 사용자다 -->
        <div class="rl-alt" id="rlAlt" hidden role="group" aria-label="다른 곳 후보"></div>

        <div class="rl-rail" id="rlRail"></div>

        <!-- 이동수단과 지역 방문자는 궁금할 때만 본다. 펼쳐 두면 갈래가 아래로 밀린다 -->
        <details class="rl-more">
          <summary>이동수단과 지역 방문자</summary>
          <div class="rl-modes" id="rlModes" hidden></div>

        <!-- 지역 방문자 — 시도 단위 과거 실측. 집중률(시군구 예측)과 눈금이 달라 따로 둔다 -->
          <div class="rl-modes" id="rlVisitors" hidden></div>
        </details>
        <!-- 말로 하기 — 운전 중이거나 걷는 중에는 화면을 못 본다.
             소리는 거들 뿐이고 화면이 본문이다. 들은 말도 한 말도 여기 적힌다 -->
        <div class="rl-voice-bar">
          <!-- 어디서나 되는 길. 누른 것이 곧 부른 것이라 부르는 말이 필요 없다 -->
          <button type="button" class="rl-voicebtn rl-voicebtn-main" id="rlVoicePushBtn"
                  onclick="rlVoicePush()">눌러서 말하기</button>
          <!-- 되는 기기에서만. 아이폰은 중간에 끊길 수 있다고 미리 말해 준다 -->
          <button type="button" class="rl-voicebtn" id="rlVoiceBtn"
                  onclick="rlVoiceToggle()">계속 듣기</button>
          <span class="rv-state" id="rlVoiceState"></span>
        </div>
        <div class="rl-voice" id="rlVoice" hidden>
          <div class="rv-log" id="rlVoiceLog" role="log" aria-live="polite" hidden></div>
          <div class="rv-ask" id="rlVoiceAsk" hidden></div>
          <!-- 말이 안 되는 기기(아이폰 사파리)에서는 같은 말을 글로 넣는다.
               해석하는 곳은 하나다 — 규칙이 두 벌이면 한쪽만 고쳐진다 -->
          <div class="rv-type">
            <input id="rlVoiceText" type="text" autocomplete="off"
                   placeholder="다음 어디야 · 붐벼? · 날씨 · 길 안내"
                   aria-label="실시간에게 물어보기" onkeydown="rlVoiceKey(event)">
            <button type="button" onclick="rlVoiceSend()">묻기</button>
          </div>
        </div>


        <p class="rl-src">혼잡도는 한국관광공사 관광지 집중률 예측값, 이동시간은 티맵 자동차 경로입니다.</p>
      </section>

    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════════════
     *  실시간
     *
     *  값이 없으면 없다고 쓴다. 0 으로 채우지 않는다.
     *  좌표는 있으면 쓰고 없으면 시각으로 가른다 — 위치 권한을
     *  막아도 화면이 돌아야 한다.
     * ════════════════════════════════════════════════════════ */
    (function () {
      'use strict';

      var rlTrip = null, rlTimer = null, rlPos = null;
      /* 다음 정거장. rlPaint 가 채우고 「길 안내」가 읽는다.
         좌표가 없으면 null 로 둔다 — 좌표 없이 안내를 시작하면 바로 막힌다. */
      var rlNextStop = null;
      var rlLast = null;        /* 마지막으로 받아 그린 한 벌. live-voice.js 가 읽는다 */
      var rlDayNo = 1;          /* 바꾸기 API 가 몇 일차인지 물어본다 */

      /* 로그인 토큰. 이 프로젝트는 전역 fetch 래퍼가 없어서 부르는 쪽이 직접 붙인다 —
         안 붙이면 내 여행 목록이 비어서 「열 여행이 없습니다」가 뜬다 */
      function rlToken() {
        return localStorage.getItem('accessToken') || sessionStorage.getItem('accessToken');
      }
      function rlAuth() {
        var t = rlToken();
        return t ? { Authorization: 'Bearer ' + t } : {};
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ── 여행 고르기 ─────────────────────────────────── */
      async function rlLoadTrips() {
        var box = document.getElementById('rlTrips');
        if (!box) return;
        try {
          var r = await fetch('/api/live/trips', { headers: rlAuth() });
          var j = await r.json();
          var list = (j && j.success && j.data) || [];

          if (!list.length) {
            /* 로그인해야 내 여행이 보인다. 「없다」와 「못 본다」는 다른 말이다 */
            var anon = !document.body.classList.contains('logged-in') &&
                       !localStorage.getItem('accessToken') &&
                       !sessionStorage.getItem('accessToken');
            box.innerHTML = anon
              ? '<div class="rl-empty">' +
                  '<p class="rl-empty-1">로그인하면 저장한 여행이 보입니다.</p>' +
                  '<p class="rl-empty-2">여행을 고르면 지금 어디쯤인지, ' +
                    '다음이 어디인지 바로 나옵니다.</p>' +
                  '<button type="button" class="rl-go" onclick="go(&#39;login&#39;)">로그인</button>' +
                '</div>'
              : '<div class="rl-empty">' +
                  '<p class="rl-empty-1">실시간으로 열 여행이 없습니다.</p>' +
                  '<p class="rl-empty-2">일정을 만들면 여기에 나타납니다. ' +
                    '지난 여행은 이틀이 지나면 내려갑니다.</p>' +
                  '<button type="button" class="rl-go" onclick="goNewPlanner()">경로 만들기</button>' +
                '</div>';
            return;
          }

          var KO = { BEFORE: '떠나기 전', TODAY: '여행 중', AFTER: '지난 여행' };
          box.innerHTML = list.map(function (t) {
            return '<button type="button" class="rl-trip" onclick="rlOpen(' + t.tripId + ')">' +
              '<span class="rl-trip-s rl-' + esc(t.phase).toLowerCase() + '">' +
                esc(KO[t.phase] || '') + '</span>' +
              '<b class="rl-trip-t">' + esc(t.title || t.destination) + '</b>' +
              '<span class="rl-trip-d">' + esc(t.startDate) +
                (t.endDate && t.endDate !== t.startDate ? ' ~ ' + esc(t.endDate) : '') + '</span>' +
            '</button>';
          }).join('');

          /* 홈의 「지금 보기」로 들어왔으면 그 여행을 바로 연다.
             여행이 하나뿐인데 고르라고 또 물으면 한 번 더 누르게 만든다.
             goRefresh 가 새로고침을 하므로 window 가 아니라 sessionStorage 로 온다.
             한 번 쓰고 지운다 — 다음에 실시간을 그냥 열면 목록부터 보여야 한다. */
          var want = null;
          try {
            want = Number(sessionStorage.getItem('liveOpenTripId')) || null;
            sessionStorage.removeItem('liveOpenTripId');
          } catch (e) {}
          if (want && list.some(function (t) { return t.tripId === want; })) rlOpen(want);

        } catch (e) {
          box.innerHTML = '<div class="rl-empty">' +
            '<p class="rl-empty-1">여행 목록을 불러오지 못했습니다.</p>' +
            '<p class="rl-empty-2">연결을 확인하고 다시 불러와 주세요.</p>' +
            '<button type="button" class="rl-go" onclick="goRefresh(&#39;live&#39;)">다시 불러오기</button>' +
          '</div>';
        }
      }

      /* 날씨.
         서버는 이미 하늘·기온·강수확률·실내외 위험을 다 실어 보내는데
         화면이 한 번도 안 쓰고 있었다. headline 한 줄에만 반영됐다.
         우산을 챙길지는 「비」라는 낱말이 아니라 숫자를 봐야 정해진다.

         값이 없으면 칸을 만들지 않는다. 「날씨 정보 없음」도 안 쓴다 —
         다음 정거장 줄에 쓸모없는 회색 칸이 하나 더 붙을 뿐이다. */
      function rlWeatherChip(w) {
        if (!w) return '';
        var bits = [];
        var sky = w.label || w.sky;
        if (sky) bits.push(sky);
        if (w.rainProb != null) bits.push('비 ' + w.rainProb + '%');
        if (w.tempMin != null && w.tempMax != null) {
          bits.push(Math.round(w.tempMin) + '~' + Math.round(w.tempMax) + '도');
        }
        if (!bits.length) return '';

        /* 평년값은 예보가 아니다. 그렇게 적는다 — 11일 뒤부터는 이 값이 온다 */
        var normal = w.source === 'NORMAL';
        /* 야외인데 비 소식이면 그것부터 말한다. 나머지는 참고다 */
        var risk = w.outdoorRisk === true;

        return '<span class="rl-wx' + (risk ? ' rl-wx-risk' : '') + '">' +
          (risk ? '야외 · ' : '') + esc(bits.join(' · ')) +
          (normal ? ' <i>평년값</i>' : '') + '</span>';
      }

      /* ── 언제 받은 값인가 ─────────────────────────────
         이 화면은 「실시간」이라고 이름 붙어 있다. 그러면 화면에 있는 숫자가
         언제 것인지 말해야 한다. 안 그러면 사용자는 늘 지금 것이라고 믿는다.

         전에는 rlRefresh 의 catch 가 실패를 통째로 삼켰다. 지하철에 들어가
         연결이 끊겨도 화면은 그대로였다. 70초를 기다려도 글자 하나 안 바뀌었다.
         그 사이 붐빔은 바뀌어 있을 수 있는데 화면은 아무 말도 안 했다.
         옛 값을 지금 값인 척 보여 주는 것이 빈칸보다 나쁘다. */
      var rlSnapAt = 0;        /* 마지막으로 받아 낸 시각 */
      var rlOffline = false;   /* 직전 시도가 실패했나 */
      var rlGeoDenied = false; /* 위치를 못 받았나 */
      var rlFreshTimer = null;

      function rlFreshPaint() {
        var el = document.getElementById('rlFresh');
        if (!el) return;
        var bits = [];

        if (rlSnapAt) {
          var min = Math.floor((Date.now() - rlSnapAt) / 60000);
          bits.push(min < 1 ? '방금 받은 값입니다' : min + '분 전에 받은 값입니다');
        }
        if (rlOffline) {
          bits.push('지금은 연결되지 않아 새로 받지 못하고 있습니다');
        }
        /* 위치는 없어도 화면이 돈다. 그래도 무엇이 빠지는지는 말해 준다 */
        if (rlGeoDenied) {
          bits.push('위치를 몰라 시각만으로 어디쯤인지 가늠합니다');
        }

        if (!bits.length) { el.hidden = true; return; }
        el.hidden = false;
        el.classList.toggle('rl-fresh-off', rlOffline);
        el.innerHTML = esc(bits.join(' · ')) +
          ' <button type="button" class="rl-again" onclick="rlAgain()">다시 받기</button>';
      }

      /* ── 지금 상황 ───────────────────────────────────── */
      async function rlRefresh() {
        if (!rlTrip) return;
        var q = '/api/live/now?tripId=' + rlTrip;
        if (rlPos) q += '&lat=' + rlPos[0] + '&lng=' + rlPos[1];

        try {
          var r = await fetch(q, { headers: rlAuth() });
          var j = await r.json();
          var d = (j && j.success && j.data) || null;
          if (!d) throw new Error('빈 응답');
          rlPaint(d);
          rlSnapAt = Date.now();
          rlOffline = false;
        } catch (e) {
          /* 삼키지 않는다. 화면이 옛 값을 들고 있다는 사실을 화면이 말한다 */
          rlOffline = true;
        }
        rlFreshPaint();
      }

      window.rlAgain = function () { rlRefresh(); };

      /* 말로 하기(live-voice.js)가 읽는 창구.
         전역을 늘리지 않으려고 함수 둘만 낸다 — 바깥에서 값을 바꿀 수는 없다. */
      window.rlSnapshot = function () {
        if (!rlLast) return { tripId: rlTrip };
        return {
          tripId: rlTrip, next: rlLast.next, crowd: rlLast.crowd,
          weather: rlLast.weather, headline: rlLast.headline, dayNo: rlLast.dayNo
        };
      };
      window.rlPosition = function () { return rlPos ? [+rlPos[0], +rlPos[1]] : null; };

      function rlPaint(d) {
        rlLast = d;                      /* 말로 하기가 이걸 읽는다 */
        rlNextStop = (d.next && d.next.lat != null && d.next.lng != null) ? d.next : null;
        var when = document.getElementById('rlWhen');
        var head = document.getElementById('rlHead');
        var next = document.getElementById('rlNext');
        var acts = document.getElementById('rlActs');
        var rail = document.getElementById('rlRail');

        var KO = { BEFORE: '떠나기 전', TODAY: '여행 중', AFTER: '지난 여행' };
        if (when) when.textContent =
          (d.title || '') + ' · ' + (d.date || '') +
          (d.dayNo ? ' · ' + d.dayNo + '일차' : '') +
          ' · ' + (KO[d.phase] || '');
        if (head) head.textContent = d.headline || '';

        /* 다음 정거장 — 이 화면에서 제일 큰 것 */
        if (next) {
          var n = d.next || {};
          if (!n.name) {
            next.innerHTML = '<p class="rl-none">오늘 남은 일정이 없습니다.</p>';
          } else {
            var c = d.crowd || {};
            next.innerHTML =
              '<p class="rl-next-lb">다음</p>' +
              '<b class="rl-next-n">' + esc(n.name) + '</b>' +
              '<p class="rl-next-m">' +
                (n.time ? '<em>' + esc(n.time) + '</em>' : '') +
                (n.sub ? ' · ' + esc(n.sub) : '') +
              '</p>' +
              /* 실측(SK)과 예측(관광공사)을 같은 얼굴로 두지 않는다 */
              (c.rate != null
                ? '<span class="rl-cw cw-' + esc(c.levelKey || 'mid') + '">' +
                    (c.source === 'SK' || c.source === 'SK_LIVE' ? '지금 ' : '예측 ') +
                    esc(c.levelLabel || '') + ' ' + c.rate + '</span>'
                /* 「없음」은 한적하다는 말로 읽힌다. 예측 대상이 아닌 곳(숙소·식당),
                   데이터가 아예 없는 지역(광주·전남), 조회 실패가 전부 여기로 온다.
                   「확인되지 않음」은 우리가 손 놓았다는 말로 들려서, 다시 받아 보면
                   될 수도 있다는 뜻이 담기게 고쳤다 */
                : '<span class="rl-cw rl-cw-none">혼잡도 정보 갱신 필요</span>') +
              rlWeatherChip(d.weather);
          }
        }

        /* 지금 할 수 있는 것 — 버튼을 크게. 움직이면서 누른다 */
        if (acts) {
          acts.innerHTML = (d.actions || []).map(function (a) {
            /* 길 안내는 넷 중 마지막에 누르는 것이라 채워서 세운다 */
            var go = a.key === 'navi' ? ' rl-act-go' : '';
            return '<button type="button" class="rl-act' + go + '" onclick="rlDo(\'' + esc(a.key) + '\')">' +
              '<b>' + esc(a.label) + '</b><span>' + esc(a.note) + '</span></button>';
          }).join('');
        }

        /* 그날 동선 — 지난 곳은 물린다 */
        if (rail) {
          rail.innerHTML = (d.stops || []).map(function (s, i) {
            return '<div class="rl-st' + (s.now ? ' rl-st-now' : '') +
                   (s.passed ? ' rl-st-done' : '') + '">' +
              '<span class="rl-st-t">' + esc(s.time || ('0' + (i + 1)).slice(-2)) + '</span>' +
              '<span class="rl-st-n">' + esc(s.name) + '</span>' +
              (s.crowdLabel ? '<span class="rl-st-c">' + esc(s.crowdLabel) + '</span>' : '') +
            '</div>';
          }).join('');
        }

        if (d.dayNo) rlDayNo = d.dayNo;
        rlModes(d);
        rlVisitors(d);
      }

      /* ── 지역 방문자 ───────────────────────────────────
       * 「이 지역에 원래 사람이 많은 날인가」를 본다. 집중률은 그 장소가 지금 붐비는지이고
       * 이것은 시도 전체에 며칠 전 실제로 몇 명이 왔는지다. 눈금이 다르니 한 줄로 합치지 않는다. */
      var rlVisitKey = null;
      function rlVisitors(d) {
        var box = document.getElementById('rlVisitors');
        if (!box || !d.destination) return;
        if (rlVisitKey === d.destination) return;   // 여행이 같으면 다시 묻지 않는다
        rlVisitKey = d.destination;
        box.hidden = false;
        box.innerHTML = '<p class="rl-modes-lb">지역 방문자</p><p class="rl-modes-note">불러오는 중</p>';

        fetch('/api/tour/visitor-trend?destination=' + encodeURIComponent(d.destination), { headers: rlAuth() })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var v = j && j.success ? j.data : null;
            if (!v || v.status !== 'OK') {
              box.innerHTML = '<p class="rl-modes-lb">지역 방문자</p>' +
                '<p class="rl-modes-note">' + esc((v && v.note) || '지역 방문자 통계를 받지 못했습니다.') + '</p>';
              return;
            }
            var d8 = String(v.latestDate || '');
            var when = d8.length === 8 ? (+d8.slice(4, 6)) + '월 ' + (+d8.slice(6, 8)) + '일' : d8;
            var cmp = v.deltaPercent == null ? ''
              : (v.deltaPercent > 0 ? ' · 같은 요일 평균보다 ' + v.deltaPercent + '% 많음'
                 : v.deltaPercent < 0 ? ' · 같은 요일 평균보다 ' + Math.abs(v.deltaPercent) + '% 적음'
                 : ' · 같은 요일 평균과 비슷함');
            box.innerHTML = '<p class="rl-modes-lb">지역 방문자</p>' +
              '<div class="rl-mode"><span class="rl-mode-n">' + esc(v.areaName || '') + ' 외지인</span>' +
              '<span class="rl-mode-v"><b>' + Number(v.latest).toLocaleString() + '</b>명</span></div>' +
              '<p class="rl-modes-note">' + esc(when + (v.dayOfWeek ? '(' + v.dayOfWeek + ')' : '') + ' 실측' + cmp) + '. ' +
              '시도 단위라 다음 장소의 붐빔과는 다른 눈금입니다.</p>';
          })
          .catch(function () {
            rlVisitKey = null;
            box.innerHTML = '<p class="rl-modes-lb">지역 방문자</p><p class="rl-modes-note">지역 방문자 통계를 받지 못했습니다.</p>';
          });
      }

      /* ── 이동수단 셋 ─────────────────────────────────
       * 지금 있는 곳에서 다음 정거장까지를 자차·대중교통·도보로 각각 잰다.
       * 「차로 24분」만 보면 지하철이 더 빠른 날인지 알 수 없다.
       *
       * 서버로는 격자로 뭉갠 좌표만 보낸다 (소수 3자리, 약 110m).
       * 정밀 좌표는 브라우저 안에서만 쓴다.
       */
      var MODE_KO = { CAR: '자차', TRANSIT: '대중교통', WALK: '도보' };
      var rlModeKey = null;   // 같은 구간을 두 번 재지 않는다. 티맵 호출 한도가 있다

      function grid(v) { return Math.round(v * 1000) / 1000; }

      function rlModes(d) {
        var box = document.getElementById('rlModes');
        if (!box) return;

        var n = d.next || {};
        var from = rlPos ? { lat: +rlPos[0], lng: +rlPos[1] } : (d.here || {});
        /* 좌표가 없으면 아예 안 띄운다. 「0분」으로 채우지 않는다 */
        if (n.lat == null || n.lng == null || from.lat == null || from.lng == null) {
          box.hidden = true; box.innerHTML = ''; rlModeKey = null;
          return;
        }
        box.hidden = false;

        var key = grid(from.lat) + ',' + grid(from.lng) + '>' + n.lat + ',' + n.lng;
        if (key === rlModeKey) return;   // 같은 자리, 같은 목적지면 다시 재지 않는다
        rlModeKey = key;
        box.innerHTML = '<p class="rl-modes-lb">이동수단</p>' +
                        '<p class="rl-modes-note">재는 중</p>';

        /* 자차만 잰다. 대중교통 길찾기와 보행자 길찾기는 TMAP 과 별개 상품이라
           앱키를 따로 받아야 하는데, 사지 않기로 정했다 (2026-09-20).
           그래서 있지도 않은 값을 기다리지 않는다.
           (전에는 403 이 키를 통째로 껐는데 그건 KeyRing 쪽에서 고쳐졌다.
            지금은 compare 도 잴 수 있는 것만 부른다.) */
        fetch('/api/route/travel-time', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            originName: (d.here && d.here.name) || '지금 위치',
            originLat: grid(from.lat),
            originLng: grid(from.lng),
            mode: 'CAR',
            stops: [{ name: n.name, lat: n.lat, lng: n.lng }]
          })
        }).then(function (r) { return r.json(); })
          .then(function (j) {
            var m = (j && j.success && j.data) || null;
            if (!m) throw new Error('no data');
            rlPaintModes(box, { CAR: m });
          })
          .catch(function () {
            rlModeKey = null;   // 다음 주기에 다시 잰다
            box.innerHTML = '<p class="rl-modes-lb">이동수단</p>' +
                            '<p class="rl-modes-note">이동시간을 재지 못했습니다.</p>';
          });
      }

      function rlPaintModes(box, m) {
        var rows = ['CAR', 'TRANSIT', 'WALK'].map(function (k) {
          var p = m[k];
          if (!p) return '';
          var min = p.totalMinutes, fare = p.totalFare;
          /* 길을 못 찾으면 서버가 0 을 합계로 준다. 0분으로 적지 않고 못 쟀다고 적는다 */
          var measured = (p.legs || []).some(function (l) { return l && l.minutes != null; });
          if (!measured || !(min > 0)) min = null;
          /* 한 구간도 못 쟀는데 「나머지만 더한 값」이라고 하면 없는 값을 말하는 셈이다 */
          if (!measured) p = Object.assign({}, p, { note: '길을 찾지 못했습니다' });
          return '<div class="rl-mode">' +
            '<span class="rl-mode-n">' + MODE_KO[k] + '</span>' +
            (min != null
              ? '<span class="rl-mode-v"><b>' + min + '</b>분' +
                  (fare ? ' · <b>' + fare.toLocaleString() + '</b>원' : '') +
                '</span>'
              : '<span class="rl-mode-x">' + esc(p.note || '재지 못했습니다') + '</span>') +
          '</div>';
        }).join('');
        box.innerHTML = '<p class="rl-modes-lb">이동수단</p>' + rows +
          '<p class="rl-modes-note">대중교통과 도보 시간은 제공하지 않습니다. 자차만 실제로 잽니다.</p>';
      }

      /* 콘솔에서 부르는 점검 — 좌표 뭉개기와 같은 구간 건너뛰기 */
      window._rlModeCheck = function () {
        console.assert(grid(35.158698) === 35.159, '3자리로 뭉갠다: ' + grid(35.158698));
        console.assert(grid(35.158612) === grid(35.158988), '같은 격자면 같은 값');
        console.assert(grid(35.1586) !== grid(35.1600), '다른 격자면 다른 값');
        var before = rlModeKey;
        rlModeKey = '1,2>3,4';
        console.assert(rlModeKey === '1,2>3,4', '키가 남는다');
        rlModeKey = before;
        console.log('OK _rlModeCheck 통과');
        return true;
      };

      /* ── 장소 확인하기 ─────────────────────────────────
       * 당일이면 실측(SK 실시간 인원·TMAP 실시간 교통), 아니면 예측(관광공사·기상청).
       * 무엇을 근거로 한 말인지 줄마다 적는다. 문제가 있으면 갈래를 주고 고르게 한다 —
       * 아무 문제가 없어도 「그대로 가도 됩니다」라고 말한다. */
      var KIND_KO = { CROWD: '붐빔', RAIN: '비', TRAFFIC: '길' };
      var rlChecking = false;

      function rlCheckBox() { return document.getElementById('rlCheck'); }

      /* 서버에 확인을 한 번 묻는다. 실패하면 사람이 읽을 이유를 던진다 */
      async function rlFetchCheck() {
        var body = { tripId: rlTrip };
        /* 서버에는 뭉갠 좌표만 보낸다 (소수 3자리, 약 110m) */
        if (rlPos) { body.lat = grid(+rlPos[0]); body.lng = grid(+rlPos[1]); }
        var r = await fetch('/api/crowd/check', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, rlAuth()),
          body: JSON.stringify(body)
        });
        var j = await r.json().catch(function () { return null; });
        if (!j || !j.success || !j.data) {
          /* 429 는 「고장」이 아니라 「오늘 다 썼다」다. 둘을 같은 말로 쓰면 안 된다 —
             고장인 줄 알면 새로 고치며 계속 누른다. 서버가 보낸 말을 그대로 쓴다. */
          var e = new Error((j && j.message) ||
            (r.status === 429 ? '오늘 확인은 다 썼습니다. 내일 다시 확인할 수 있습니다.'
                              : '지금은 확인하지 못했습니다. 잠시 뒤에 다시 눌러 주세요.'));
          e.spent = (r.status === 429);
          throw e;
        }
        /* 「남은 확인 2번」이 message 로 온다. 단추에 적어 준다 —
           세 번뿐이라는 것을 다 쓴 뒤에 아는 것과 미리 아는 것은 다르다. */
        rlLeftLabel(j.message);
        return j.data;
      }

      /* 단추에 남은 횟수를 적는다. 다 쓰면 단추를 감추지 않고 왜 못 누르는지 남긴다 —
         사라진 단추는 고장으로 보이고, 사용자는 자기가 뭘 잘못했는지 찾는다. */
      function rlLeftLabel(msg) {
        var btn = document.getElementById('rlCheckBtn');
        if (!btn) return;
        var n = /(\d+)/.exec(String(msg || ''));
        var sub = btn.querySelector('span');
        if (!sub) return;
        if (n) {
          sub.textContent = Number(n[1]) > 0
            ? '다음 장소가 붐비는지, 비가 오는지, 늦지 않는지 봅니다 · 오늘 ' + n[1] + '번 남음'
            : '오늘 확인을 다 썼습니다. 내일 다시 확인할 수 있습니다';
          btn.disabled = Number(n[1]) <= 0 ? false : false;   /* 막지 않는다. 눌러도 이유를 말해 준다 */
        }
      }

      function rlSpentLabel() {
        var btn = document.getElementById('rlCheckBtn');
        var sub = btn && btn.querySelector('span');
        if (sub) sub.textContent = '오늘 확인을 다 썼습니다. 내일 다시 확인할 수 있습니다';
      }

      window.rlCheck = async function () {
        if (!rlTrip || rlChecking) return;
        var box = rlCheckBox(), btn = document.getElementById('rlCheckBtn');
        rlChecking = true;
        if (btn) btn.disabled = true;
        if (box) { box.hidden = false; box.innerHTML = '<p class="rl-modes-note">확인하는 중</p>'; }
        try {
          rlPaintCheck(await rlFetchCheck());
        } catch (e) {
          /* 다 쓴 것은 고장이 아니다. 단추에도 남겨 다시 누르지 않게 한다 */
          if (e && e.spent) rlSpentLabel();
          if (box) box.innerHTML = '<p class="rl-modes-note">' +
            esc(e && e.message && !/fetch/i.test(e.message) ? e.message : '연결이 끊겨 확인하지 못했습니다.') + '</p>';
        } finally {
          rlChecking = false;
          if (btn) btn.disabled = false;
        }
      };

      /* ── 확인한 때 ─────────────────────────────────────
       * 실시간이라면서 지난 값을 지금처럼 보이면 안 된다. 몇 분 전 값인지 늘 적고,
       * 10분이 넘으면 오래됐다고 말하고 한 번에 바꾸는 갈래를 막는다. */
      var RL_STALE_MS = 10 * 60 * 1000;
      var rlAgeTimer = null;
      function rlStale() { return !rlLastCheck || (Date.now() - rlLastCheck._at) > RL_STALE_MS; }
      function rlAgeTick() {
        var el = document.getElementById('rlCheckAge');
        if (!el || !rlLastCheck) { clearInterval(rlAgeTimer); return; }
        var min = Math.floor((Date.now() - rlLastCheck._at) / 60000);
        var stale = rlStale();
        el.textContent = (min < 1 ? '방금 확인' : min + '분 전 확인') +
          (stale ? ' · 오래된 결과입니다. 다시 확인해 주세요' : '');
        el.style.color = stale ? 'var(--num)' : '';
        document.querySelectorAll('#rlCheck .rl-oneclick').forEach(function (b) {
          b.disabled = stale;
          b.title = stale ? '확인한 지 10분이 넘었습니다. 다시 확인한 뒤 바꿔 주세요' : '';
        });
      }

      var rlLastCheck = null;
      function rlPaintCheck(d, changeHtml) {
        d._at = Date.now();
        rlLastCheck = d;
        var box = rlCheckBox();
        if (!box) return;
        var small = 'font-size:12px;color:var(--text3)';
        var html = (changeHtml || '') +
          '<p style="' + small + ';margin:0 0 6px">' + esc(d.modeLabel || '') +
          (d.checkedAt ? ' · ' + esc(d.checkedAt.slice(11)) : '') +
          ' · <span id="rlCheckAge">방금 확인</span></p>' +
          '<p style="font-size:15px;font-weight:800;margin:0 0 10px">' + esc(d.verdict ? d.verdict.text : '') + '</p>';

        (d.findings || []).forEach(function (f) {
          var mark = f.status === 'OK' ? (f.issue ? '확인 · 걸림' : '확인 · 괜찮음')
                   : f.status === 'NO_DATA' ? '자료 없음'
                   : f.status === 'SKIPPED' ? '보지 않음' : '확인되지 않음';
          html += '<div style="padding:6px 0;border-top:1px solid var(--border2)">' +
            '<b style="font-size:13px">' + esc(KIND_KO[f.kind] || f.kind) + '</b>' +
            ' <span style="' + small + '">' + esc(mark) + '</span>' +
            '<div style="font-size:13px">' + esc(f.summary || '') + '</div>' +
            (f.sourceLabel ? '<div style="' + small + '">근거: ' + esc(f.sourceLabel) + '</div>' : '') +
          '</div>';
        });

        if ((d.options || []).length) {
          html += '<div class="rl-acts" style="margin-top:10px">' + d.options.map(function (o, i) {
            return '<button type="button" class="rl-act' + (o.oneClick ? ' rl-oneclick' : '') +
              '" onclick="rlCheckPick(' + i + ')">' +
              '<b>' + esc(o.label) + '</b><span>' + esc(o.note || '') + '</span></button>';
          }).join('') + '</div>';
        }
        var undo = rlUndoGet();
        if (undo) {
          html += '<div class="rl-acts" style="margin-top:6px"><button type="button" class="rl-act" onclick="rlUndoChange()">' +
            '<b>되돌리기</b><span>' + esc(undo.label) + ' 전 일정으로 돌아갑니다</span></button></div>';
        }
        box.innerHTML = html;
        box.hidden = false;
        clearInterval(rlAgeTimer);
        rlAgeTick();
        rlAgeTimer = setInterval(rlAgeTick, 30000);
      }

      /* ── 바꾸기 전후 ───────────────────────────────────
       * 숫자를 지어내지 않는다. 서버가 준 값(구간 legMinutes, 확인 결과의 붐빔·비)만 앞뒤로 놓는다. */
      function rlUsable(route) {
        return Array.isArray(route) && route.some(function (d) {
          return d && Array.isArray(d.places) && d.places.some(function (p) {
            return p && p.transit == null && typeof p.name === 'string' && p.name.trim() !== '';
          });
        });
      }
      function rlParseRoute(raw) {
        try {
          var v = raw;
          if (typeof v === 'string') {
            if (v.indexOf('[') < 0) return null;
            v = JSON.parse(v.substring(v.indexOf('['), v.lastIndexOf(']') + 1));
          }
          return rlUsable(v) ? v : null;
        } catch (e) { return null; }
      }
      async function rlGetRoute() {
        var r = await fetch('/api/trips/' + rlTrip + '/routes?t=' + Date.now(), { headers: rlAuth() });
        var j = await r.json().catch(function () { return null; });
        return j && j.success ? rlParseRoute(j.data) : null;
      }
      function rlDayOf(route, day) {
        return (route || []).filter(function (d) { return d && d.day == day; })[0] || (route || [])[day - 1] || null;
      }
      function rlStops(dayObj) {
        return ((dayObj && dayObj.places) || []).filter(function (p) { return p && p.transit == null && p.name; });
      }
      /* 그날 이동 시간 합. 한 구간이라도 못 쟀으면 null — 모르는 걸 0 으로 더하지 않는다 */
      function rlLegSum(dayObj) {
        var s = rlStops(dayObj);
        if (s.length < 2) return null;
        var sum = 0;
        for (var i = 1; i < s.length; i++) {
          if (typeof s[i].legMinutes !== 'number') return null;
          sum += s[i].legMinutes;
        }
        return sum;
      }
      function rlFind(res, kind) {
        return ((res && res.findings) || []).filter(function (f) { return f.kind === kind && f.status === 'OK'; })[0] || null;
      }

      function rlDiffHtml(label, beforeRoute, afterRoute, day, beforeCheck, afterCheck) {
        var b = rlDayOf(beforeRoute, day), a = rlDayOf(afterRoute, day);
        var bn = rlStops(b).map(function (p) { return p.name; });
        var an = rlStops(a).map(function (p) { return p.name; });
        var gone = bn.filter(function (n) { return an.indexOf(n) < 0; });
        var came = an.filter(function (n) { return bn.indexOf(n) < 0; });
        var lines = [];
        if (gone.length) lines.push('빠진 곳 — ' + gone.join(', '));
        if (came.length) lines.push('들어간 곳 — ' + came.join(', '));
        if (!gone.length && !came.length) lines.push('그날 들를 곳은 그대로입니다.');

        var bs = rlLegSum(b), as = rlLegSum(a);
        if (bs != null && as != null && bs !== as) {
          lines.push('그날 이동 시간 ' + bs + '분 → ' + as + '분 (' +
            (as < bs ? (bs - as) + '분 줄었습니다' : (as - bs) + '분 늘었습니다') + ')');
        } else if (bs == null || as == null) {
          lines.push('이동 시간은 재지 못한 구간이 있어 비교하지 않았습니다.');
        }

        var bp = beforeCheck && beforeCheck.place && beforeCheck.place.name;
        var ap = afterCheck && afterCheck.place && afterCheck.place.name;
        if (bp && ap && bp !== ap) lines.push('다음 장소 ' + bp + ' → ' + ap);

        var bc = rlFind(beforeCheck, 'CROWD'), ac = rlFind(afterCheck, 'CROWD');
        var br = bc && bc.values && bc.values.rate, ar = ac && ac.values && ac.values.rate;
        if (typeof br === 'number' && typeof ar === 'number' && br !== ar) {
          lines.push('붐빔 ' + br + ' → ' + ar + ' (' + (ac.sourceLabel || '') + ')');
        }
        var bw = rlFind(beforeCheck, 'RAIN'), aw = rlFind(afterCheck, 'RAIN');
        if (bw && aw && bw.issue && !aw.issue) lines.push('비 맞는 야외 일정이 없어졌습니다.');
        if (bw && aw && bw.issue && aw.issue) lines.push('아직 비 맞는 야외 일정이 남아 있습니다.');

        return '<div style="margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--ui-plate)">' +
          '<p style="font-size:13px;font-weight:800;margin:0 0 4px">' + esc(label) + ' — 바꿨습니다</p>' +
          lines.map(function (l) { return '<div style="font-size:13px">' + esc(l) + '</div>'; }).join('') +
        '</div>';
      }

      /* 되돌리기 — 바꾸기 전 일정을 그대로 다시 저장한다. 새로고침해도 이어지게 세션에 둔다 */
      function rlUndoKey() { return 'liveUndo:' + rlTrip; }
      function rlUndoGet() {
        try { return JSON.parse(sessionStorage.getItem(rlUndoKey()) || 'null'); } catch (e) { return null; }
      }
      function rlUndoSet(v) {
        try {
          if (v) sessionStorage.setItem(rlUndoKey(), JSON.stringify(v));
          else sessionStorage.removeItem(rlUndoKey());
        } catch (e) {}
      }

      async function rlApplyOneClick(o) {
        if (rlStale()) { toast('확인한 지 10분이 넘었습니다. 다시 확인한 뒤 바꿔 주세요.'); return; }
        if (!confirm(o.label + ' — ' + (o.note || '') + '\n이대로 바꿀까요? 바꾼 뒤에 되돌릴 수 있습니다.')) return;
        var box = rlCheckBox();
        var day = rlLastCheck && rlLastCheck.place ? rlLastCheck.place.day : null;
        var beforeCheck = rlLastCheck;

        /* 되돌릴 수 없으면 바꾸지 않는다 */
        var before = null;
        try { before = await rlGetRoute(); } catch (e) {}
        if (!before) { toast('지금 일정을 읽지 못해 되돌릴 수 없으므로 바꾸지 않았습니다.'); return; }

        if (box) box.insertAdjacentHTML('afterbegin', '<p class="rl-modes-note" id="rlApplying">바꾸는 중</p>');
        var after = null, ok = false, msg = '';
        try {
          var r = await fetch(o.endpoint, { method: o.method || 'POST', headers: rlAuth() });
          var j = await r.json().catch(function () { return null; });
          ok = !!(j && j.success);
          msg = (j && j.message) || '';
          if (ok) after = rlParseRoute(j.data) || await rlGetRoute();
        } catch (e) { msg = '연결이 끊겼습니다.'; }
        var ap = document.getElementById('rlApplying'); if (ap) ap.remove();

        if (!ok || !after) {
          toast(msg || '바꾸지 못했습니다. 일정은 그대로입니다.');
          return;
        }
        rlUndoSet({ label: o.label, route: before, at: Date.now() });

        var afterCheck = null;
        try { afterCheck = await rlFetchCheck(); } catch (e) {}
        var diff = rlDiffHtml(o.label, before, after, day, beforeCheck, afterCheck);
        if (afterCheck) rlPaintCheck(afterCheck, diff);
        else if (box) box.innerHTML = diff + '<p class="rl-modes-note">바꾼 뒤 상황은 확인하지 못했습니다. 다시 확인해 주세요.</p>';
        rlRefresh();
      }

      window.rlUndoChange = async function () {
        var u = rlUndoGet();
        if (!u || !rlUsable(u.route)) { rlUndoSet(null); toast('되돌릴 일정이 없습니다.'); return; }
        if (!confirm(u.label + ' 전 일정으로 되돌릴까요?')) return;
        try {
          var r = await fetch('/api/trips/' + rlTrip + '/routes/reorder', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, rlAuth()),
            body: JSON.stringify(u.route)
          });
          var j = await r.json().catch(function () { return null; });
          if (!j || !j.success) { toast((j && j.message) || '되돌리지 못했습니다.'); return; }
        } catch (e) { toast('연결이 끊겨 되돌리지 못했습니다.'); return; }
        rlUndoSet(null);
        toast('바꾸기 전 일정으로 되돌렸습니다.');
        rlRefresh();
        rlCheck();
      };

      /* 고른 갈래를 한다. 한 번에 끝나는 것(실내로 바꾸기)은 한 번 더 묻고 부른다 */
      window.rlCheckPick = async function (i) {
        var o = rlLastCheck && rlLastCheck.options && rlLastCheck.options[i];
        if (!o) return;
        if (o.key === 'keep') {
          var box = rlCheckBox(); if (box) box.hidden = true;
          toast('계획대로 갑니다.');
          return;
        }
        if (o.key === 'other_mode') { toast(o.note || '다른 이동수단은 지도 앱에서 비교해 보세요.'); return; }
        if (o.key === 'leave_now' || o.key === 'navi') { rlDo('navi'); return; }
        if (o.key === 'swap' || o.key === 'quiet') {
          /* 지도에서 고르게 넘기되, 무엇을 왜 고치러 가는지 들고 간다 */
          var p = rlLastCheck.place || {};
          var why = (rlLastCheck.findings || []).filter(function (f) { return f.issue; })
            .map(function (f) { return f.summary; }).join(' ');
          try {
            sessionStorage.setItem('mapIntentDetail', JSON.stringify({
              key: o.key, tripId: rlTrip, day: p.day, name: p.name, time: p.time,
              reason: why, source: 'live-check', at: Date.now()
            }));
          } catch (e) {}
          rlDo(o.key);
          return;
        }
        if (o.oneClick && o.endpoint) { rlApplyOneClick(o); return; }
        toast(o.note || '');
      };

      /* ── 바깥에서 부르는 것 ──────────────────────────── */

      window.rlOpen = function (tripId) {
        var cb = rlCheckBox(); if (cb) { cb.hidden = true; cb.innerHTML = ''; }
        rlLastCheck = null;
        clearInterval(rlAgeTimer);
        rlTrip = tripId;
        window._authToken = rlToken();   /* nav-drive 의 경로 요청이 이 값을 쓴다 */
        document.getElementById('rlPick').hidden = true;
        document.getElementById('rlNow').hidden = false;

        /* 위치는 있으면 쓴다. 막아도 시각으로 가르므로 화면은 돌아간다 */
        rlSnapAt = 0; rlOffline = false; rlGeoDenied = false;
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function (p) {
            rlPos = [p.coords.latitude.toFixed(6), p.coords.longitude.toFixed(6)];
            rlGeoDenied = false;
            rlRefresh();
          }, function () {
            /* 막아도 화면은 돈다. 다만 무엇이 빠지는지 말해 준다 —
               전에는 아무 말도 없어서 위치를 준 사람과 화면이 똑같아 보였다 */
            rlGeoDenied = true;
            rlFreshPaint();
          }, { timeout: 8000, maximumAge: 30000 });
        } else {
          rlGeoDenied = true;
        }
        rlRefresh();

        /* 1분마다 다시 묻는다. 더 자주 물어도 집중률은 하루 단위라 안 바뀐다 */
        clearInterval(rlTimer);
        rlTimer = setInterval(rlRefresh, 60000);

        /* 「N분 전」은 받지 않아도 흘러간다. 시계는 따로 돈다 */
        clearInterval(rlFreshTimer);
        rlFreshTimer = setInterval(rlFreshPaint, 20000);
      };

      /* 화면을 덮어 뒀다 돌아왔을 때.
         전에는 아무 처리가 없어서 다음 주기(최대 60초)까지 옛 값이었다.
         주머니에 넣었다 꺼내는 것이 이 화면을 쓰는 보통 방식인데. */
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        if (!rlTrip) return;
        rlRefresh();
      });

      /* 연결이 돌아왔을 때. 다음 주기까지 기다리면 「연결되지 않아 새로 받지 못하고
         있습니다」가 최대 1분 더 붙어 있다 — 이미 연결됐는데 안 됐다고 말하는 셈이다.
         끊긴 순간도 마찬가지다. 다음 주기를 기다리지 않고 그 자리에서 말한다. */
      window.addEventListener('online', function () {
        if (!rlTrip) return;
        rlRefresh();
      });
      window.addEventListener('offline', function () {
        if (!rlTrip) return;
        rlOffline = true;
        rlFreshPaint();
      });

      window.rlBack = function () {
        if (window.rlVoiceStop) window.rlVoiceStop();
        clearInterval(rlTimer); clearInterval(rlFreshTimer);
        rlSnapAt = 0; rlOffline = false; rlGeoDenied = false;
        var fr = document.getElementById('rlFresh'); if (fr) fr.hidden = true;
        rlTrip = null; rlPos = null; rlModeKey = null; rlVisitKey = null;
        document.getElementById('rlNow').hidden = true;
        document.getElementById('rlPick').hidden = false;
        rlLoadTrips();
      };

      /* 바꾸기 — 한 번 묻고, 바꾸기 전 일정을 들고 있다가, 되돌릴 수 있게 둔다.
         되돌릴 수 없으면 아예 바꾸지 않는다. 돌아올 길이 없는 변경은 제안이 아니다. */
      async function rlApplyLive(o) {
        if (!rlTrip) return;
        if (!confirm(o.label + ' — ' + (o.note || '') + '\n이대로 바꿀까요? 바꾼 뒤에 되돌릴 수 있습니다.')) return;

        var before = null;
        try { before = await rlGetRoute(); } catch (e) {}
        if (!rlUsable(before)) { toast('지금 일정을 읽지 못해 되돌릴 수 없으므로 바꾸지 않았습니다.'); return; }

        var ok = false, msg = '', data = null;
        try {
          var r = await fetch(o.endpoint, { method: 'POST', headers: rlAuth() });
          var j = await r.json().catch(function () { return null; });
          ok = !!(j && j.success);
          msg = (j && j.message) || '';
          data = j && j.data;
        } catch (e) { msg = '연결이 끊겼습니다.'; }

        if (!ok) { toast(msg || '바꾸지 못했습니다. 일정은 그대로입니다.'); return; }

        /* 서버가 「바꿀 게 없다」고 답할 때가 있다. 그때는 되돌리기를 만들지 않는다 */
        if (data && data.changed === false) { toast(data.note || '바꿀 것이 없습니다.'); return; }

        rlUndoSet({ label: o.label, route: before, at: Date.now() });
        toast((data && data.note) || o.done || '바꿨습니다. 되돌릴 수 있습니다.');
        rlRefresh();
      }

      /* 다른 곳으로 — 서버가 그날 한적한 곳을 골라 준다. 여기서는 보여 주고 고르게만 한다.
         「이대로 가기」를 늘 같이 둔다. 하나를 강요하지 않는다. */
      var rlAltList = [];
      var rlAltTarget = '';

      async function rlQuiet() {
        var box = document.getElementById('rlAlt');
        if (!box || !rlTrip) return;
        box.hidden = false;
        box.innerHTML = '<p class="rl-modes-lb">다른 곳으로</p><p class="rl-modes-note">한적한 곳을 찾는 중</p>';

        var d = null;
        try {
          var r = await fetch('/api/live/quiet?tripId=' + rlTrip + '&day=' + rlDayNo + '&limit=3',
                              { headers: rlAuth() });
          var j = await r.json().catch(function () { return null; });
          d = j && j.success ? j.data : null;
        } catch (e) { /* 아래에서 없다고 쓴다 */ }

        if (!d) {
          box.innerHTML = '<p class="rl-modes-lb">다른 곳으로</p>' +
            '<p class="rl-modes-note">후보를 불러오지 못했습니다.</p>' + rlKeepBtn();
          return;
        }

        rlAltList = d.candidates || [];
        rlAltTarget = d.target || '';

        if (!rlAltList.length) {
          box.innerHTML = '<p class="rl-modes-lb">다른 곳으로</p>' +
            '<p class="rl-modes-note">' + esc(d.note || '바꿀 만한 곳을 찾지 못했습니다.') + '</p>' +
            rlKeepBtn();
          return;
        }

        box.innerHTML = '<p class="rl-modes-lb">다른 곳으로</p>' +
          '<p class="rl-modes-note">' + esc(rlAltTarget) +
            (d.targetCrowd != null ? ' 집중률 ' + esc(String(d.targetCrowd)) : '') +
            ' 대신 갈 만한 곳입니다.</p>' +
          rlAltList.map(function (c, i) {
            return '<button type="button" class="rl-alt-pick" onclick="rlAltPick(' + i + ')">' +
              '<b class="rl-alt-n">' + esc(c.name) + '</b>' +
              '<span class="rl-cw cw-' + esc(c.crowdKey || 'low') + '">' +
                esc(c.crowdLabel || '') + ' ' + esc(String(c.crowd)) + '</span>' +
              (c.address ? '<span class="rl-alt-a">' + esc(c.address) + '</span>' : '') +
            '</button>';
          }).join('') +
          '<p class="rl-modes-note">' + esc(d.note || '') + '</p>' + rlKeepBtn();
      }

      function rlKeepBtn() {
        return '<button type="button" class="rl-alt-keep" onclick="rlAltKeep()">이대로 가기</button>';
      }

      window.rlAltKeep = function () {
        var box = document.getElementById('rlAlt');
        if (box) { box.hidden = true; box.innerHTML = ''; }
        toast('계획대로 갑니다.');
      };

      /* 고른 곳으로 그 자리만 갈아 끼운다. 시각은 자리에 남긴다 —
         14:20 슬롯은 그대로고 거기 들어가는 장소만 바뀐다. */
      window.rlAltPick = async function (i) {
        var c = rlAltList[i];
        if (!c || !rlTrip) return;
        if (!confirm(c.name + '(으)로 바꿀까요? 바꾼 뒤에 되돌릴 수 있습니다.')) return;

        var route = null;
        try { route = await rlGetRoute(); } catch (e) {}
        if (!rlUsable(route)) { toast('지금 일정을 읽지 못해 바꾸지 않았습니다.'); return; }

        var before = JSON.parse(JSON.stringify(route));
        var day = rlDayOf(route, rlDayNo);
        var hit = day && Array.isArray(day.places) ? rlFindPlace(day.places, rlAltTarget) : null;
        if (!hit) { toast('바꿀 장소를 찾지 못했습니다.'); return; }

        hit.name = c.name;
        hit.lat = c.lat;
        hit.lng = c.lng;
        if (c.address) hit.sub = c.address;
        /* 바뀐 곳의 집중률은 저장할 때 서버가 다시 붙인다. 옛 값을 들고 있으면 거짓이 된다 */
        delete hit.crowd; delete hit.crowdLabel; delete hit.crowdKey;

        var ok = false, msg = '';
        try {
          var r = await fetch('/api/trips/' + rlTrip + '/routes/reorder', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, rlAuth()),
            body: JSON.stringify(route)
          });
          var j = await r.json().catch(function () { return null; });
          ok = !!(j && j.success);
          msg = (j && j.message) || '';
        } catch (e) { msg = '연결이 끊겼습니다.'; }

        if (!ok) { toast(msg || '바꾸지 못했습니다. 일정은 그대로입니다.'); return; }

        rlUndoSet({ label: '다른 곳으로', route: before, at: Date.now() });
        rlAltKeep();
        toast(c.name + '(으)로 바꿨습니다. 되돌릴 수 있습니다.');
        rlRefresh();
      };

      /* 이름으로 그날 정거장 하나를 찾는다. 공백·괄호가 달라도 같은 곳으로 본다 */
      function rlFindPlace(places, name) {
        var want = rlNorm(name);
        for (var k = 0; k < places.length; k++) {
          var p = places[k];
          if (!p || p.transit != null || typeof p.name !== 'string' || !p.name.trim()) continue;
          var got = rlNorm(p.name);
          if (!want) return p;
          if (got === want || got.indexOf(want) >= 0 || want.indexOf(got) >= 0) return p;
        }
        return null;
      }
      function rlNorm(s) {
        return String(s == null ? '' : s).replace(/[\s()\[\]·,.-]/g, '');
      }

      /* 지도로 넘길 때 어느 여행인지 넘긴다.
         지도는 window._currentTripId 와 sessionStorage.plannerDraftId 만 읽는다 —
         전에는 쓰지도 않는 currentTripId 에 넣어서 지도가 「아직 만들어진 일정이 없습니다」로 열렸다 */
      function rlGoMap(intent) {
        window._currentTripId = rlTrip;
        try {
          sessionStorage.setItem('plannerDraftId', String(rlTrip));
          sessionStorage.removeItem('ai_generated_route');
          if (intent) sessionStorage.setItem('mapIntent', intent);
        } catch (e) {}
        go('map');
      }

      window.rlDo = function (key) {
        if (key === 'map') {
          rlGoMap(null);
          return;
        }
        if (key === 'navi') {
          /* 좌표가 있으면 실제로 안내를 시작한다. 없으면 없다고 말한다 —
             좌표 없이 시작하면 nav-drive 가 바로 막히고 사용자는 이유를 모른다. */
          if (rlNextStop && window.startDrive) {
            window.startDrive(rlNextStop);
          } else if (!rlNextStop) {
            toast('다음 목적지 좌표가 없어 길 안내를 켤 수 없습니다.');
          } else {
            toast('길 안내를 불러오지 못했습니다. 새로 고쳐 주세요.');
          }
          return;
        }
        if (key === 'swap') {
          rlApplyLive({
            label: '순서 바꾸기',
            note: '붐비는 곳을 남은 구간의 뒤로 미룹니다',
            endpoint: '/api/trips/' + rlTrip + '/routes/swap-crowded?day=' + rlDayNo
          });
          return;
        }
        if (key === 'indoor') {
          rlApplyLive({
            label: '실내로 바꾸기',
            note: '비 예보라 그날 야외 일정을 실내로 다시 짭니다',
            endpoint: '/api/trips/' + rlTrip + '/routes/indoor-replace?day=' + rlDayNo,
            done: '실내 일정으로 바꿨습니다. 되돌릴 수 있습니다.'
          });
          return;
        }
        if (key === 'quiet') {
          rlQuiet();
          return;
        }
      };

      window.initLivePage = function () {
        clearInterval(rlTimer);
        rlTrip = null; rlPos = null; rlModeKey = null; rlVisitKey = null;
        var pick = document.getElementById('rlPick');
        var now = document.getElementById('rlNow');
        if (pick) pick.hidden = false;
        if (now) now.hidden = true;
        rlLoadTrips();
      };

      /* 화면을 떠나면 타이머를 끈다. 안 끄면 배터리를 먹는다 */
      window.stopLivePage = function () {
        if (window.rlVoiceStop) window.rlVoiceStop();   /* 화면을 떠나면 마이크를 놓는다 */
        clearInterval(rlTimer); clearInterval(rlAgeTimer); clearInterval(rlFreshTimer);
      };
    })();
  </script>
</div>
